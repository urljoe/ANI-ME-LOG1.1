<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140c0e">
<meta name="description" content="Ani-Me Log — your personal anime library and video player.">
<link rel="manifest" href="manifest.webmanifest">
<title>Ani-Me Log</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2C5 6 3 13 8 21c5-2 9-9 4-19z' fill='%23d98c8f'/%3E%3C/svg%3E">
<style>
:root{--bg:#0b1115;--bg2:#0f171c;--panel:#121d24;--panel2:#172630;--line:#22343f;--text:#e9f2f0;--mut:#8ba3a6;--amber:#f2b35c;--mint:#6fd3b0;--rose:#ff8f7e;--ink:#091015;--r:16px;--disp:Bahnschrift,"DIN Alternate","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;--body:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1100px 560px at 90% -12%,#1b2e37 0,transparent 62%),var(--bg);color:var(--text);font:15px/1.5 var(--body);min-height:100vh;display:flex;flex-direction:column;padding-bottom:96px}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
a{color:var(--mint)}
.top{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:16px;padding:14px 28px;background:#0b1115ea;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center;font:700 21px var(--disp);letter-spacing:.03em;white-space:nowrap}
.brand small{display:block;font:600 10px var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--mint)}
.tools{margin-left:auto;display:flex;gap:10px;align-items:center}
.search{width:min(340px,40vw);padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg2)}
.search:focus{border-color:var(--mint);outline:none}
.ptitle{padding:26px 28px 4px}
.ptitle h1{font:700 42px/1 var(--disp);margin:0;letter-spacing:.01em;text-transform:uppercase}
.ptitle p{margin:6px 0 0;color:var(--mut)}
body.nohead .ptitle{display:none}
#view{flex:1;min-width:0}
.page{padding:18px 28px 28px;max-width:1500px;margin:0 auto}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:20;display:flex;gap:4px;padding:6px;border-radius:999px;background:#0f1a20f2;border:1px solid #2a404b;box-shadow:0 14px 40px #0009;backdrop-filter:blur(12px);max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.nav{background:none;border:0;padding:9px 14px;border-radius:999px;color:var(--mut);cursor:pointer;font:600 14px var(--body);white-space:nowrap}
.nav:hover{color:var(--text);background:#ffffff0d}
.nav.on{background:var(--amber);color:var(--ink)}
footer{padding:18px 28px;color:var(--mut);font-size:12px;text-align:center;letter-spacing:.14em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;transition:.15s;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--mint)}
.btn:disabled{opacity:.4;cursor:default;border-color:var(--line)}
.btn.pri{background:var(--mint);border-color:var(--mint);color:var(--ink);font-weight:700}
.btn.on{border-color:var(--amber);color:var(--amber)}
.btn.on.pri{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--mut);font-size:13px}
.chip:hover{color:var(--text)}
.chip.on{background:var(--mint);border-color:var(--mint);color:var(--ink);font-weight:700}
.tag{display:inline-block;padding:2px 9px;border-radius:6px;background:#ffffff10;color:var(--mut);font-size:12px;margin:2px 4px 2px 0}
.tag.hi{background:var(--amber);color:var(--ink);font-weight:700}
.note{color:var(--mut);font-size:13px;margin:6px 0}
.empty,.empty-box{color:var(--mut);text-align:center;padding:40px 16px;border:1px dashed var(--line);border-radius:var(--r);margin:10px 0}
.err{color:var(--rose)}
input,select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--text);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--mint)}
label{display:block}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:grid;gap:10px}
h3{font:700 17px var(--disp);text-transform:uppercase;letter-spacing:.07em;margin:22px 0 12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.panel h3{margin-top:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-top:14px}
.hero{position:relative;overflow:hidden;border-radius:22px;margin:18px 28px 6px;min-height:340px;display:flex;align-items:flex-end;padding:36px;background:var(--panel);border:1px solid var(--line)}
.hero::before{content:"";position:absolute;inset:0;background:var(--hb) center/cover;filter:blur(30px) saturate(1.1) brightness(.42);transform:scale(1.15)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0b1115 8%,#0b1115a0 58%,transparent)}
.hero>*{position:relative;z-index:1}
.hero>img{position:absolute;right:36px;top:36px;width:190px;aspect-ratio:2/3;object-fit:cover;border-radius:14px;z-index:1;box-shadow:0 22px 50px #000a}
.hero h2{font:700 50px/1 var(--disp);text-transform:uppercase;margin:0 0 10px;max-width:16ch}
.hero .row{margin-top:14px}
.rows{padding:0 28px}
.rh{margin:26px 0 8px}
.rh button{background:none;border:0;cursor:pointer;font:700 15px var(--disp);text-transform:uppercase;letter-spacing:.09em;color:var(--text);padding:0}
.rh button:hover{color:var(--mint)}
.rw{position:relative}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-behavior:smooth;scroll-snap-type:x proximity;padding:4px 2px 12px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:0 0 160px;height:240px;scroll-snap-align:start}
.ar{position:absolute;top:40%;z-index:2;width:36px;height:60px;border:1px solid var(--line);background:#0b1115e6;color:var(--text);font-size:24px;cursor:pointer;border-radius:10px}
.ar.l{left:-12px}.ar.r{right:-12px}
.ar:hover{border-color:var(--mint)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(164px,1fr));grid-auto-rows:250px;grid-auto-flow:dense;gap:14px}
.grid .card:nth-child(7n+1){grid-column:span 2;grid-row:span 2}
.grid .card:nth-child(7n+4){grid-row:span 2}
.card{position:relative;height:100%;border-radius:16px;overflow:hidden;background:var(--panel2);border:1px solid var(--line);transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:var(--mint)}
.card .open{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;background:none;cursor:pointer;text-align:left;display:block}
.poster{position:absolute;inset:0;display:grid;place-items:center;font:700 72px var(--disp);color:#ffffff1f;background:linear-gradient(160deg,#21384a,#0e181e)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cb{position:absolute;left:0;right:0;bottom:0;padding:58px 12px 12px;background:linear-gradient(transparent,#070c0ff2 52%)}
.cb b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:700 15px/1.2 var(--body)}
.cb small{display:block;color:var(--amber);font-size:12px;margin-top:2px}
.cb>div{margin-top:4px}
.cb .tag:nth-child(n+3){display:none}
.bmc{position:absolute;top:10px;right:10px;z-index:2;width:34px;height:34px;border-radius:10px;border:1px solid #ffffff30;background:#0b1115cc;color:var(--text);cursor:pointer;display:grid;place-items:center}
.bmc.on{background:var(--amber);color:var(--ink);border-color:var(--amber)}
.sy{display:flex;gap:30px;flex-wrap:wrap;align-items:flex-start}
.sy>img{width:240px;aspect-ratio:2/3;object-fit:cover;border-radius:18px;box-shadow:0 24px 60px #0009}
.sy>div{flex:1;min-width:280px}
.sy h1{font:700 54px/.95 var(--disp);text-transform:uppercase;margin:0 0 12px}
.meta{margin-bottom:12px}
.syn{color:#c7d6d3;max-width:70ch}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-bottom:10px}
.ep{position:relative;padding:14px 12px 12px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(135deg,#182a35,#0f181d);text-align:left;cursor:pointer;font:700 24px var(--disp);transition:border-color .15s}
.ep:hover{border-color:var(--amber)}
.ep small{display:block;font:400 11px var(--body);color:var(--mut);margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ep.seen{opacity:.6}
.ep.seen::after{content:"✓";position:absolute;top:8px;right:10px;color:var(--mint);font-size:13px}
.ep.cur{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint) inset}
.ep:not(:disabled):not([title^="No"])[title^="Plays"]{border-style:dashed}
.eprs{display:grid;gap:8px}
.epr{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);text-align:left;cursor:pointer;width:100%}
.epr:hover{border-color:var(--amber)}
.epr.cur{border-color:var(--mint)}
.epr b{min-width:110px}
.epr small{color:var(--mut)}
.fl{list-style:none;padding:0;margin:0}
.fl li{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--panel)}
.fl li>div{flex:1;min-width:0}
.fl b{display:block}
.fl small{color:var(--mut);font-size:12px}
.src{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--panel)}
.src>div{flex:1;min-width:0}
.src b{display:block}
.src small{display:block;color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src small.err{color:var(--rose)}
.providers{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin-top:12px}
.provider-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:13px;background:var(--panel2)}
.provider-card b{display:block}
.provider-card small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.provider-card input{margin-top:8px}
.provider-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.provider-note{padding:12px 14px;border:1px dashed #f2b35c66;border-radius:12px;color:var(--mut);font-size:12px;margin-top:12px}

.rec{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px;border-radius:12px;cursor:pointer}
.rec:hover{background:#ffffff0a}
.rp{width:46px;height:64px;border-radius:8px;overflow:hidden;background:var(--panel2);flex:0 0 46px}
.rp img{width:100%;height:100%;object-fit:cover}
.rec b{display:block}
.rec small{color:var(--mut)}
details.play-sources{margin-top:12px}
details.play-sources summary{cursor:pointer;color:var(--mut)}
.wt{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding:12px 20px 20px;max-width:1800px;margin:0 auto}
@media(max-width:1000px){.wt{grid-template-columns:1fr}}
.wt>div:first-child{min-width:0}
.wtop{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.wt-title{flex:1;min-width:200px}
.wt-title b{display:block;font:700 19px var(--disp);text-transform:uppercase;letter-spacing:.03em}
.wt-title small{color:var(--mut)}
.vid{position:relative;background:#000;border-radius:18px;overflow:hidden;aspect-ratio:16/9;border:1px solid var(--line)}
.vid video,.vid iframe{width:100%;height:100%;border:0;display:block;background:#000}
.vid video{object-fit:contain}
.vid.fill video{object-fit:cover}
.seek-zone{position:absolute;top:0;bottom:54px;width:32%;z-index:3;border:0;background:transparent;color:#fff;display:flex;align-items:center;cursor:pointer;touch-action:manipulation;user-select:none}
.seek-zone.left{left:0;justify-content:flex-start;padding-left:clamp(12px,4vw,42px)}
.seek-zone.right{right:0;justify-content:flex-end;padding-right:clamp(12px,4vw,42px)}
.seek-zone span{display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border-radius:999px;background:#071015b8;border:1px solid #ffffff35;font:700 13px var(--body);opacity:0;transform:scale(.94);transition:opacity .12s,transform .12s;pointer-events:none}
.seek-zone:hover span,.seek-zone:focus-visible span,.seek-zone:active span{opacity:1;transform:scale(1)}
.seek-flash{position:absolute;top:38%;z-index:4;left:50%;transform:translate(-50%,-50%);padding:10px 16px;border-radius:999px;background:#071015d9;border:1px solid #ffffff40;color:#fff;font-weight:700;opacity:0;pointer-events:none;transition:opacity .15s}
.seek-flash.show{opacity:1}
.vid .empty{border:0;display:grid;place-items:center;height:100%;margin:0}
.vbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
.pill{padding:5px 11px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--mut)}
.pill.amber{color:var(--amber);border-color:#f2b35c55}
.grow{flex:1}
.pl-h{font:700 17px var(--disp);text-transform:uppercase;letter-spacing:.07em}
.set{display:flex;flex-direction:column;gap:14px}
.set-sec{display:grid;grid-template-columns:70px 1fr;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.set-n{font:700 40px/1 var(--disp);color:var(--amber)}
.set-b h3{margin:0 0 4px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:14px}
.fields label span{display:block;font-size:11px;color:var(--mut);margin-bottom:6px;text-transform:uppercase;letter-spacing:.12em}
.srcs{display:grid;gap:8px;margin-top:12px}
.srcrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.srcrow>div{flex:1;min-width:0}
.srcrow b{display:block}
.srcrow small{color:var(--mut);font-size:12px}
.sw{position:relative;display:inline-block;width:44px;height:24px;flex:0 0 44px;margin:0}
.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:999px;background:#2a3d47;transition:.2s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--text);transition:.2s}
.sw input:checked+span{background:var(--mint)}
.sw input:checked+span::after{transform:translateX(20px);background:var(--ink)}
.toggle-row{display:flex;align-items:center;gap:12px;margin-top:16px}
.toggle-row small{display:block;color:var(--mut)}
.infobox{margin-top:16px;padding:14px 16px;border-radius:12px;border:1px dashed #6fd3b055;background:#6fd3b00d}
.infobox p{margin:4px 0 0}
.set-foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px}
.route{flex:1;min-width:240px;color:var(--mut);font-size:13px}
.route b{color:var(--text);font-weight:600}
.dl-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:14px 18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
.dl-head b{font:700 22px var(--disp);color:var(--amber)}
.dl-head .row{margin-left:auto}
.dl-list{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.dl-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(120px,1fr) auto;gap:16px;align-items:center;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.dl-meta b{display:block}
.dl-meta small{color:var(--mut)}
.bar{height:8px;border-radius:99px;background:#ffffff12;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--amber));border-radius:99px}
.pct{font:700 15px var(--disp);color:var(--amber)}
.cloud-hero{display:flex;gap:20px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding:24px;border-radius:22px;background:radial-gradient(640px 260px at 0 0,#1d4a48 0,transparent 70%),var(--panel);border:1px solid var(--line)}
.kick{font:600 11px var(--body);letter-spacing:.24em;text-transform:uppercase;color:var(--mint)}
.cloud-hero h2{font:700 46px/1 var(--disp);text-transform:uppercase;margin:8px 0}
.cloud-state{display:flex;gap:8px;align-items:center;padding:8px 14px;border-radius:999px;background:#ffffff0c;font-size:13px}
.cloud-state i{width:9px;height:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px var(--mint)}
.cloud-state.warn i{background:var(--rose);box-shadow:0 0 12px var(--rose)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.stat{padding:16px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.stat small{display:block;color:var(--mut);text-transform:uppercase;letter-spacing:.12em;font-size:11px}
.stat b{display:block;font:700 34px/1.1 var(--disp);margin:6px 0 2px}
.stat span{color:var(--mut);font-size:12px}
.cloud-acts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.tbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.tbl th{text-align:left;color:var(--mut);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:8px}
.tbl td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:top}
.schema{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto;color:#bfe9dc;font:13px/1.6 Consolas,monospace;margin:10px 0 0}
#toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--amber);color:var(--ink);padding:10px 18px;border-radius:12px;font-weight:600;display:none;z-index:99;box-shadow:0 10px 30px #0008}
.sheet{position:fixed;inset:0;background:#05090ccc;display:grid;place-items:center;z-index:50;padding:20px}
.sheet-box{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px;max-width:460px;width:100%}
.sheet-box small{color:var(--mint);text-transform:uppercase;letter-spacing:.14em;font-size:11px}
.sheet-box h3{margin:6px 0 16px;font-size:20px}
.aud-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.aud{padding:20px 14px;border-radius:16px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;text-align:left}
.aud:hover{border-color:var(--amber)}
.aud b{display:block;font:700 32px var(--disp);color:var(--amber)}
.aud small{color:var(--mut);text-transform:none;letter-spacing:0;font-size:13px}
@media(max-width:700px){.top{padding:10px 14px}.page{padding:14px}.hero{margin:12px 14px;padding:22px;min-height:300px}.hero>img{display:none}.hero h2{font-size:38px}.ptitle{padding:18px 14px 4px}.ptitle h1{font-size:30px}.search{display:none}.rows{padding:0 14px}.dl-row{grid-template-columns:1fr}.set-sec{grid-template-columns:1fr}.sy>img{width:150px}.sy h1{font-size:38px}.nav{padding:8px 10px;font-size:13px}}
</style>
</head>
<body>
<nav class="top">
  <div class="brand"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C5 6 3 13 8 21c5-2 9-9 4-19z" fill="#6fd3b0"/><path d="M12 2c3 6 1 13-4 19" fill="none" stroke="#f2b35c" stroke-width="1.2"/></svg><div>Ani-Me Log<small>beta</small></div></div>
  <div class="tools"><input class="search" id="q" type="search" placeholder="Find a title" aria-label="Search titles"><button class="btn sm" data-act="refresh">Sync</button></div>
</nav>
<div class="ptitle"><h1 id="ttl">Home</h1><p id="sub"></p></div>
<section id="view"></section>
<nav class="dock" aria-label="Sections">
  <button class="nav" data-v="home">Home</button>
  <button class="nav" data-v="library">Library</button>
  <button class="nav" data-v="latest">Latest</button>
  <button class="nav" data-v="schedule">Schedule</button>
  <button class="nav" data-v="watchlist">Watchlist</button>
  <button class="nav" data-v="history">History</button>
  <button class="nav" data-v="downloads">Downloads</button>
  <button class="nav" data-v="cloud">Cloud</button>
  <button class="nav" data-v="settings">Settings</button>

<script>
const SourceEngine=window.AniMeSourceEngine;
const K='animelog.v1',$=s=>document.querySelector(s);
let st={sources:[],proxy:'',auto:true,watch:{},hist:[],seen:{},device:'auto'},view='home',prev='home',CUR='',q='',fsrc='',LIM=120,LIB={map:new Map(),list:[]},PLAY=null,DEV='win',HLSP=null,WSORT='asc',WLIST=false;
try{Object.assign(st,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}

st.health=st.health||{};
function setHealth(name,kind,state,detail='',url=''){if(!name)return;st.health[name]=st.health[name]||{};st.health[name][kind]={state,detail,checkedAt:Date.now(),url};save()}
function healthState(name,kind){return st.health[name]?.[kind]?.state||'unknown'}

function playbackHealthKey(name){
  const provider=SourceEngine.listProviders().find(p=>name===p.name||name.startsWith(p.name+' ·'));

}
function recordPlaybackHealth(state,detail=''){if(!PLAY)return;setHealth(playbackHealthKey(playbackSourceName()),'playback',state,detail,PLAY.url||'')}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^(https?:\/\/|blob:)/i.test(u||'')?esc(u):'';
const sleep=t=>new Promise(r=>setTimeout(r,t));
const ago=t=>{const m=Math.round((Date.now()-t)/60000);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' days ago'};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)}
const num=x=>parseFloat(x)||0;

/* hidden duplicate scanner */
const norm=t=>String(t).normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
  .replace(/[(\[][^)\]]*(dub|sub|raw|uncensored)[^)\]]*[)\]]/g,' ')
  .replace(/\b(english dub|dubbed|subbed|uncensored)\b/g,' ')
  .replace(/[^a-z0-9]+/g,' ').trim();

/* sub / dub labels from titles and source names */
function subs(raw,src){
  const o=new Set(),all=raw+' '+src;
  String(raw).replace(/\b(english|indo(?:nesian)?|spanish|portuguese|arabic|thai|vietnamese|malay|french|german|italian|russian|turkish|hindi|chinese)\s+(sub|dub)s?\b/gi,(m,l,t)=>{l=/^indo/i.test(l)?'Indo':l[0].toUpperCase()+l.slice(1).toLowerCase();o.add(l+' '+t.toLowerCase())});
  if(!o.size){if(/\bdub(bed)?\b/i.test(all))o.add('Dub');if(/\bsub(bed|s)?\b/i.test(all))o.add('Sub');if(/\braw\b/i.test(all))o.add('Raw')}
  return[...o];
}

/* parsing */
const get=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const first=(o,ps)=>{for(const p of ps){const v=get(o,p);if(v&&typeof v!=='object')return v}return ''};
const toMs=v=>typeof v==='number'?v*1000:(Date.parse(v)||0);
const big=u=>(u||'').replace(/\/s\d+(-c)?\//,'/s400/');
const plain=s=>String(s||'').replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim().slice(0,700);
function clean(t){
  t=String(t).trim();let ep='';
  const sm=t.match(/^Episode\s+(\d+(?:[-–]\d+)?)\s+of\s+(.+?)\s+is\s+out!?$/i);
  if(sm)return{title:sm[2].trim(),ep:sm[1]};
  const m=t.match(/\b(?:episode|eps?\.?)\s*(\d+)/i);
  if(m){ep=m[1];t=t.slice(0,m.index)}
  t=t.replace(/\s*\[[^\]]*\]/g,'').replace(/\s*[–-]\s*(english|indo)[^]*$/i,'').trim();
  return{title:t||String(t),ep};
}
function titleAliases(o){
  const out=new Set(), add=v=>{if(typeof v==='string'&&v.trim())out.add(v.trim())};
  if(!o||typeof o!=='object')return[];
  const t=o.title;
  if(t&&typeof t==='object'){add(t.english);add(t.romaji);add(t.native);add(t.userPreferred)}
  ['title_english','title_japanese','english','romaji','canonicalTitle'].forEach(k=>add(o[k]));
  ['titles','synonyms','abbreviatedTitles'].forEach(k=>{
    const a=o[k];if(Array.isArray(a))a.forEach(v=>add(typeof v==='string'?v:(v&& (v.title||v.name))));
  });
  const a=o.attributes;
  if(a&&typeof a==='object'){
    add(a.canonicalTitle);
    [a.titles,a.abbreviatedTitles].forEach(xs=>{if(xs&&typeof xs==='object')Object.values(xs).forEach(add)});
  }
  if(Array.isArray(o.title))o.title.forEach(v=>add(typeof v==='string'?v:v&&v.title));
  return[...out];
}
function mapItem(o){
  if(typeof o==='string')return{title:o.trim(),raw:o.trim(),aliases:[]};
  if(!o||typeof o!=='object')return null;
  const raw=first(o,['title','name','title.english','title.romaji','title_english','attributes.canonicalTitle']);
  if(!raw)return null;
  const c=clean(raw);
  let sc=num(first(o,['score','averageScore','attributes.averageRating']));if(sc>10)sc/=10;
  const video=first(o,['videoUrl','video_url','streamUrl','stream_url','playUrl','play_url','embedUrl','embed_url','episodeUrl','episode_url','attributes.videoUrl','attributes.streamUrl']);
  return{title:c.title,raw:String(raw),aliases:titleAliases(o),
    image:first(o,['image','img','poster','cover','thumbnail','thumbnail_480_url','images.jpg.image_url','coverImage.large','attributes.posterImage.small'])||(o.identifier?'https://archive.org/services/img/'+o.identifier:''),
    link:first(o,['url','siteUrl','link','href'])||(o.attributes&&o.attributes.slug?'https://kitsu.io/anime/'+o.attributes.slug:'')||(o.identifier?'https://archive.org/details/'+o.identifier:''),
    video:typeof video==='string'?video:'',ep:c.ep||first(o,['episode','ep','latest_episode']),
    date:toMs(first(o,['date','published','updated_at','aired.from','attributes.startDate','created_at','created_time'])),
    desc:plain(first(o,['synopsis','description','summary','attributes.synopsis'])),
    tags:(Array.isArray(o.genres)?o.genres.map(g=>typeof g==='string'?g:g&&g.name).filter(Boolean):[]).slice(0,6),
    total:num(first(o,['episodes','attributes.episodeCount','episodeCount'])),score:sc};
}
function findList(d,dep=0){
  if(Array.isArray(d))return d;
  if(!d||typeof d!=='object'||dep>4)return[];
  if(d.response&&typeof d.response==='object'){const r=findList(d.response,dep+1);if(r.length)return r}
  for(const k of ['data','items','results','anime','entries','list','media','series','docs'])if(Array.isArray(d[k]))return d[k];
  for(const v of Object.values(d)){const r=findList(v,dep+1);if(r.length)return r}
  return[];
}
function parseXML(txt){
  const x=new DOMParser().parseFromString(txt,'text/xml');
  if(x.querySelector('parsererror'))throw new Error('Not valid JSON or RSS/Atom');
  return[...x.querySelectorAll('item,entry')].map(n=>{
    const g=t=>n.querySelector(t)?.textContent?.trim()||'';
    const l=n.querySelector('link'),th=n.getElementsByTagName('media:thumbnail')[0]||n.querySelector('enclosure');
    const raw=g('title'),c=clean(raw);
    return{title:c.title,raw,ep:c.ep,link:l?(l.getAttribute('href')||l.textContent.trim()):'',image:big(th?.getAttribute('url')),date:Date.parse(g('pubDate')||g('published')||g('updated'))||0};
  }).filter(i=>i.title);
}
function parseText(txt){
  let d;try{d=JSON.parse(txt)}catch(e){return parseXML(txt)}
  return findList(d).map(mapItem).filter(Boolean);
}

/* network: direct first, then (optionally) a background proxy scout that remembers what works */
const PROXIES=[u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),u=>'https://corsproxy.io/?url='+encodeURIComponent(u),u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u)];
const BAD=new Set();
async function req(a){
  const o={};
  if(AbortSignal.timeout)o.signal=AbortSignal.timeout(14000);
  if(a.body)Object.assign(o,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(a.body)});
  const r=await fetch(a.url,o);
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.text();
}
async function grab(u,body){
  const host=new URL(u).hostname,list=[];
  if(st.proxy)list.push({url:st.proxy+encodeURIComponent(u),body});
  else if(!BAD.has(host)){list.push({url:u,body});if(body&&body.query)list.push({url:u+'?query='+encodeURIComponent(body.query)})}
  if(st.auto!==false)[0,1,2].sort((a,b)=>(b===st.pok)-(a===st.pok)).forEach(i=>{if(!body||i===1)list.push({url:PROXIES[i](u),body,px:i})});
  let last;
  for(const a of list){
    try{const t=await req(a);if(a.px!==undefined)st.pok=a.px;return t}
    catch(e){last=e;if(a.px===undefined&&!st.proxy)BAD.add(host)}
  }
  throw last||new Error('No answer');
}
function jsonp(u){
  return new Promise((res,rej)=>{
    const cb='_alcb'+Date.now(),sc=document.createElement('script');
    const done=()=>{clearTimeout(t);delete window[cb];sc.remove()};
    const t=setTimeout(()=>{done();rej(new Error('timeout'))},15000);
    window[cb]=d=>{done();res(d)};
    sc.onload=()=>setTimeout(()=>{if(window[cb]){done();rej(new Error('not jsonp'))}},60);
    sc.onerror=()=>{done();rej(new Error('blocked'))};
    sc.src=u+'&callback='+cb;document.head.appendChild(sc);
  });
}
async function fetchSite(s){
  const o=new URL(s.url);let last;
  try{ /* Blogger sites allow script-tag loading, which needs no proxy */
    let es=[];
    for(let p=0;p<4;p++){const d=await jsonp(o.origin+'/feeds/posts/default?alt=json-in-script&max-results=500&start-index='+(p*500+1));const g=d.feed.entry||[];es=es.concat(g);if(g.length<500)break}
    const it=es.map(e=>{const l=(e.link||[]).find(x=>x.rel==='alternate'),raw=e.title.$t,c=clean(raw);
      return{title:c.title,raw,ep:c.ep,link:l?l.href:'',image:big((e.media$thumbnail||{}).url),date:Date.parse((e.published||{}).$t)||0}}).filter(i=>i.title);
    if(it.length)return it;
  }catch(e){last=e}
  for(const u of [o.origin+'/feeds/posts/default?alt=rss&max-results=500',o.origin+'/feed',o.origin+'/rss.xml',o.origin+'/feed.xml',s.url]){
    try{const it=parseText(await grab(u));if(it.length)return it}catch(e){last=e}
  }
  throw last||new Error('No feed found at this address. Try the site’s RSS or JSON address.');
}
const fill=(t,p,s)=>t.replace(/__PAGE__/g,p).replace(/__OFFSET__/g,(p-1)*(s.size||20));
async function fetchItems(s){
  const t=new URL(fill(s.url,1,s));
  if(!s.body&&t.pathname==='/'&&!t.search)return fetchSite(s);
  return fetchPaged(s);
}
async function fetchPaged(s){
  let all=[];
  for(let p=1;p<=(s.pages||1);p++){
    let it;
    try{it=parseText(await grab(fill(s.url,p,s),s.body?JSON.parse(fill(JSON.stringify(s.body),p,s)):null))}catch(e){if(p===1)throw e;break}
    all=all.concat(it);if(!it.length)break;
    if(p<(s.pages||1))await sleep(s.gap||700);
  }
  return all;
}
SourceEngine.registerAdapter(window.createAnimeScheduleRSSAdapter({fetchItems,parseText}));
SourceEngine.registerAdapter({
  id:'configured-feed',
  matches:source=>!!source&&(source.adapterId==='configured-feed'||source.adapter==='configured-feed'),
  load:async source=>source.raw!=null?parseText(source.raw):await fetchItems(source)
});
SourceEngine.registerAdapter(window.createProviderCatalogAdapter({fetchText:grab}));
async function load(s){
  s.status='loading';render();
  try{
    s.items=await SourceEngine.load(s,{fetchPaged:fetchItems,fetchFeed:fetchItems,fetchImported:source=>parseText(source.raw||'')});
    s.items.forEach(i=>{i.sub=subs(i.raw||i.title,s.name)});
    s.status='ok';s.error='';s.updated=Date.now();
    if(!s.items.length)s.error='Loaded, but no titles were found in this source.';
  }catch(e){
    s.status='error';
    s.error=/Failed to fetch|aborted|timeout|blocked|No answer/i.test(e.message)?'Could not verify from this browser; the request may be blocked, cross-origin, or timed out.':`Source returned an error: ${e.message}`;
  }
  const provider=SourceEngine.getProvider(s.providerId),healthName=provider?provider.name:s.name;
  const catalogState=s.status==='error'?(/Could not verify from this browser/i.test(s.error)?'unverified':/^Source returned an error: HTTP /i.test(s.error)?'degraded':'unverified'):s.error?'degraded':'reachable';
  setHealth(healthName,'catalog',catalogState,s.error||((s.items||[]).length+' catalog entries'),s.url||'');
  save();render();
}
async function checkProviderPage(providerId){
  const provider=SourceEngine.getProvider(providerId),url=st.providers[providerId];if(!provider||!url)return toast('Save this provider’s website address first.');
  setHealth(provider.name,'page','checking','Requesting the provider home page.',url);render();
  try{const text=await grab(url);if(!String(text||'').trim())throw new Error('The response was empty.');setHealth(provider.name,'page','reachable','The configured address returned a response. This does not confirm that a title page embeds or plays.',url);toast(provider.name+' responded. Playback is still unconfirmed.')}
  catch(error){const reason=/cors|cross-origin|failed to fetch/i.test(error.message)?'Browser could not inspect this cross-origin page. That does not prove the provider is down.':String(error.message||'Page check failed.');setHealth(provider.name,'page','unverified',reason,url);toast(provider.name+' page could not be verified from this browser.')}
  render();
}
async function runAll(list){
  const g={};list.forEach(s=>{let h='x';try{h=new URL(s.url).hostname}catch(e){}(g[h]=g[h]||[]).push(s)});
  await Promise.all(Object.values(g).map(async a=>{for(const s of a){await load(s);await sleep(500)}}));
}

/* merge every source into one list */
/* Merge provider records by canonical and alternate titles while retaining every source link. */
function build(){
  return SourceEngine.mergeCatalog(st.sources,norm,num);
}
const snap=e=>({k:e.k,title:e.title,image:e.image,ep:e.ep,from:(e.from||[]).slice(0,12)});
const wl=k=>!!st.watch[k];
const entryFor=k=>LIB.map.get(k)||st.watch[k]||st.hist.find(h=>h.k===k);
const epKey=x=>{const m=String(x??'').trim().match(/^(\d+(?:\.\d+)?)/);return m?String(parseFloat(m[1])):''};
const epsOf=e=>{const m=new Map();(e.from||[]).forEach(f=>{const k=epKey(f.ep);if(!k)return;if(!m.has(k))m.set(k,[]);m.get(k).push(f)});return m};

/* embeds and playback */
function embedFor(u){
  let m;
  if(/^blob:/i.test(u))return{type:'video',src:u};
  if((m=u.match(/dailymotion\.com\/(?:embed\/)?video\/([a-z0-9]+)/i))||(m=u.match(/dai\.ly\/([a-z0-9]+)/i)))return{type:'frame',src:'https://www.dailymotion.com/embed/video/'+m[1]};
  if(/rumble\.com\/embed\//i.test(u))return{type:'frame',src:u};
  if((m=u.match(/(?:youtube\.com\/watch\?(?:[^#]*&)?v=|youtu\.be\/)([\w-]{11})/i)))return{type:'frame',src:'https://www.youtube-nocookie.com/embed/'+m[1]};
  if((m=u.match(/archive\.org\/(?:details|embed)\/([^/?#]+)/i)))return{type:'frame',src:'https://archive.org/embed/'+m[1]};
  if(/\.m3u8(?:[?#]|$)/i.test(u))return{type:'hls',src:u};
  if(/\.(mp4|webm|ogg)(?:[?#]|$)/i.test(u))return{type:'video',src:u};
  if(/rumble\.com\//i.test(u))return{type:'rumble',src:u};
  if(/^https?:\/\//i.test(u))return{type:'page',src:u};
  return null;
}
function loadHls(){
  return HLSP||(HLSP=new Promise((res,rej)=>{
    if(window.Hls)return res(window.Hls);
    const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/hls.js@1.6.15/dist/hls.min.js';
    sc.onload=()=>res(window.Hls);sc.onerror=()=>{HLSP=null;rej(new Error('hls'))};document.head.appendChild(sc);
  }));
}
function attachHls(){
  const v=$('#pv');if(!v||!PLAY||!PLAY.e||PLAY.e.type!=='hls')return;
  const src=PLAY.e.src,playId=PLAY.id;
  if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=src;return}
  loadHls().then(H=>{
    if(!H.isSupported())return toast('This browser can’t play streaming video.');
    const h=new H();h.on(H.Events.ERROR,(e,d)=>{if(d.fatal&&PLAY&&PLAY.id===playId){recordPlaybackHealth('failed','Fatal HLS playback error');tryNextSource(true)}});
    h.loadSource(src);h.attachMedia(v);
  }).catch(()=>toast('Couldn’t load the video library.'));
}
function wview(){

  const i=have.indexOf(String(p.ep)),pe=i>0?have[i-1]:'',ne=i>=0&&i<have.length-1?have[i+1]:'',x=p.e;

   const seekZones=x&&(x.type==='video'||x.type==='hls')?`<button type="button" class="seek-zone left" data-seek="left" aria-label="Tap to rewind 10 seconds"><span>↶ 10s</span></button><button type="button" class="seek-zone right" data-seek="right" aria-label="Tap to skip forward 10 seconds"><span>10s ↷</span></button><div id="seek-flash" class="seek-flash" aria-live="polite"></div>`:'';
  const top=Math.max(0,...have.map(num)),tot=Math.min(300,Math.max(e.total||0,top));const allN=new Set(have);for(let k=1;k<=tot;k++)allN.add(String(k));const full=[...allN].sort((a,b)=>num(a)-num(b));
  const order=WSORT==='desc'?[...full].reverse():full;

  const rowb=ep=>{const f=epm.get(ep)||[],lb=[...new Set(f.flatMap(y=>y.sub||[]))].join(', ');return`<button class="epr ${cls(ep)}" ${epm.has(ep)?`data-act="ep" data-ep="${esc(ep)}"`:'disabled'}><b>Episode ${esc(ep)}</b><small>${esc(lb?lb+' · ':'')}${esc(f.map(y=>y.src).join(', '))}</small></button>`};
  const r=recs(e,LIB.list).slice(0,8);

<div class="wtop"><button class="btn sm" data-act="back">‹ Back</button><div class="wt-title"><b>${esc(p.title||'')}</b><small>${p.ep?'Episode '+esc(p.ep):'Playing'} · ${esc(audio)}</small></div>
<div class="row"><button class="btn sm" data-act="ep" data-ep="${esc(pe)}" ${pe?'':'disabled'}>‹ Prev</button><button class="btn sm" data-act="ep" data-ep="${esc(ne)}" ${ne?'':'disabled'}>Next ›</button><button class="btn sm" data-act="fit">${FIT==='fit'?'Fill frame':'Fit frame'}</button><button class="btn sm" data-act="fullscr">Fullscreen</button>${bmBtn(p.k)}<button class="btn sm" data-act="share">Share</button></div></div>
<div class="vid ${FIT==='fill'?'fill':''}">${frame}${seekZones}</div>
${p.note?`<p class="note">${esc(p.note)}</p>`:''}
${x&&x.type==='page'?'<p class="note">Showing the provider website inside the boxed player. If it stays blank or refuses to load, use “Open source” to open it separately.</p>':''}

async function play(u,k,title,ep,extra){
  const enteringWatch=view!=='watch';
  if(enteringWatch)history.pushState({animeLog:'watch'},'',location.href);
  const en=entryFor(k);
  if(en){st.hist=[snap(en),...st.hist.filter(h=>h.k!==en.k)].slice(0,100);save();CUR=k}
  const e=embedFor(u),opts=extra||{};
  const matched=(en&&en.from||[]).find(f=>(f.video||f.link)===u&&(!opts.sourceName||f.src===opts.sourceName));
  const audio=opts.audio||(matched?(isDub(matched)?'DUB':'SUB'):'');
  const alts=((en&&en.from)||[]).filter(f=>(f.video||f.link)&&(!ep||String(f.ep)===String(ep))&&(!audio||isDub(f)===(audio==='DUB'))&&enabledSrc(f.src)).slice(0,20);
  PLAY={id:(PLAY?.id||0)+1,k,title,ep,url:u,e,alts,sourceName:opts.sourceName||matched?.src||opts.sourceAttribution||'',audio,...opts,msg:'This link can’t be played inside the app. Use “Open source” to continue on the provider site.'};
  if(view!=='watch'&&view!=='title')prev=view;
  view='watch';draw();scrollTo(0,0);
  if(e&&e.type==='rumble'){
    try{
      const r=await fetch('https://rumble.com/api/Media/oembed.json?url='+encodeURIComponent(u));
      const m=String((await r.json()).html||'').match(/src="([^"]+)"/);if(!m)throw 0;
      PLAY.e={type:'frame',src:m[1]};
    }catch(x){PLAY.e=null;PLAY.msg='Rumble didn’t let the app look this video up. Use “Open on its own site”.'}
    draw();
  }
}

function qualityOf(e,u){const f=(e.from||[]).find(x=>(x.video||x.link)===u);const m=f&&String(f.raw||'').match(/(\d{3,4})p/i);if(m)return m[1]+'p';return typeOf(u)==='video'?'Direct file':'Stream'}
function srcAudio(n){const its=(st.sources.find(s=>s.name===n)||{}).items||[];const d=its.some(i=>isDubRaw(i.raw||i.title)),s=its.some(i=>!isDubRaw(i.raw||i.title));return [s?'Sub':'',d?'Dub':''].filter(Boolean).join(' / ')||'No titles'}
function audioOpts(e,key){const l=(epsOf(e).get(key)||[]).filter(f=>(f.video||f.link)&&enabledSrc(f.src));const o=[];if(l.some(f=>!isDub(f)))o.push('SUB');if(l.some(isDub))o.push('DUB');return o}
function pickRecords(e,key,audio){
  const mode=st.prefs.watchMode||'auto',want=audio==='DUB'?st.prefs.watchDub:st.prefs.watchSub;
  let l=(epsOf(e).get(key)||[]).filter(f=>(f.video||f.link)&&enabledSrc(f.src));

  if(mode==='verified')l=l.filter(f=>['video','hls','frame'].includes(typeOf(f.video||f.link)));

function tryNextSource(automatic=false){if(!PLAY)return;const current=PLAY,tried=[...new Set([...(current.tried||[]),current.url])];let resolved;const next=(current.alts||[]).find(f=>{const raw=f.video||f.link,candidate=SourceEngine.resolveSource(f),url=candidate?.src||raw,t=typeOf(url);if(!url||tried.includes(raw)||tried.includes(url)||automatic&&t!=='video'&&t!=='hls')return false;resolved=candidate;return true});if(!next)return toast(automatic?'Playback failed; no other playable source is available for this episode and audio.':'No other source is available for this episode and audio.');const url=resolved?.src||next.video||next.link;if(!url)return toast('That source has no usable playback page.');play(url,current.k,current.title,current.ep,{audio:current.audio,sourceName:next.src,sourceAttribution:resolved?.attribution||next.src,sourceFallback:resolved?.fallbackUrl||next.link,tried,note:(automatic?'The player reported a media error. ':'')+'Switched to '+next.src+' for the same episode and audio.'})}

/* IndexedDB store for downloaded episodes */
const DBN='ani-me-downloads';
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore('eps',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbRun(mode,fn){const d=await openDB();return new Promise((res,rej)=>{const t=d.transaction('eps',mode);const req=fn(t.objectStore('eps'));t.oncomplete=()=>res(req?req.result:undefined);t.onerror=()=>rej(t.error)})}
const dbAll=()=>dbRun('readonly',s=>s.getAll());
const dbGet=id=>dbRun('readonly',s=>s.get(id));
const dbPut=v=>dbRun('readwrite',s=>s.put(v));
const dbDel=id=>dbRun('readwrite',s=>s.delete(id));
async function loadDL(){try{const all=await dbAll();DLC=all.map(({blob,...m})=>m).sort((a,b)=>b.at-a.at)}catch(err){DLC=[]}render()}
async function deleteDownload(id){await dbDel(id);await loadDL();toast('Deleted from this device.')}
async function clearDL(){await dbRun('readwrite',s=>s.clear());await loadDL()}
async function playDownload(id){const d=await dbGet(id);if(!d||!d.blob)return toast('That download is gone.');const u=URL.createObjectURL(d.blob);markSeen(d.k,d.ep);play(u,d.k,d.title,d.ep,{audio:d.audio||'SUB'})}
async function downloadEp(k,ep){
  const e=entryFor(k);if(!e)return;
  const key=epKey(ep)||String(ep);
  const qn=String(st.prefs.quality||'720p').replace('p','');
  const score=f=>(String(f.raw||'').includes(qn)?2:0)+(f.src===st.prefs.dlSub||f.src===st.prefs.dlDub?1:0);
  const cands=pickRecords(e,key,null).filter(f=>typeOf(f.video)==='video').sort((a,b)=>score(b)-score(a));
  const rec=cands[0];
  const page=(e.from||[]).find(f=>f.link);
  if(!rec){if(page){window.open(page.link,'_blank','noopener');toast('This source has its own download controls. Opened it on its site.')}else toast('No downloadable link for this episode yet.');return}
  const id=k+'|'+key;
  DLP[id]={title:e.title,ep:key,src:rec.src,pct:0};render();
  try{
    const r=await fetch(rec.video);if(!r.ok)throw new Error('HTTP '+r.status);
    const total=+r.headers.get('content-length')||0,reader=r.body.getReader(),parts=[];let got=0;
    for(;;){const {done,value}=await reader.read();if(done)break;parts.push(value);got+=value.length;if(total)DLP[id].pct=got/total*100;render()}
    const blob=new Blob(parts,{type:r.headers.get('content-type')||'video/mp4'});
    await dbPut({id,k,title:e.title,ep:key,src:rec.src,size:blob.size,at:Date.now(),audio:isDub(rec)?'DUB':'SUB',blob});
    delete DLP[id];await loadDL();toast('Saved to this device.');
  }catch(err){
    delete DLP[id];render();
    if(page)window.open(page.link,'_blank','noopener');
    toast('This site doesn’t let the app save the file, so it opened on its site.');
  }
}
function dlView(){
  const busy=Object.entries(DLP).map(([id,p])=>({id,title:p.title,ep:p.ep,src:p.src,pct:p.pct||0,busy:true}));
  const done=DLC.map(d=>({...d,pct:100,busy:false}));
  const total=DLC.reduce((a,d)=>a+(d.size||0),0);

/* Schedule: upcoming and recent episodes from the AnimeSchedule feeds */
function scheduleView(){
  const items=st.sources.filter(s=>/AnimeSchedule/i.test(s.name)).flatMap(s=>(s.items||[]).map(i=>({...i,src:s.name})));
  const seen=new Set(),rows=items.filter(i=>{const k=norm(i.title)+'|'+i.ep;if(seen.has(k))return false;seen.add(k);return true});
  const dated=rows.filter(i=>i.date).sort((a,b)=>a.date-b.date);
  const undated=rows.filter(i=>!i.date);
  if(!rows.length)return'<div class="empty-box"><b>No schedule yet</b><p class="note">Schedule comes from the AnimeSchedule feeds. Turn them on in Settings, then press Sync.</p></div>';
  const groups={};dated.forEach(i=>{const d=new Date(i.date).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});(groups[d]=groups[d]||[]).push(i)});
  const row=i=>{const t=new Date(i.date).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});const has=LIB.map.has(norm(i.title));return`<li class="sch-row"><span class="sch-t">${esc(t)}</span><div class="sch-b"><b>${esc(i.title)}</b><small>${i.ep?'Episode '+esc(i.ep)+' · ':''}${esc(i.src)}</small></div>${has?`<button class="btn sm" data-open="${esc(norm(i.title))}">Open</button>`:''}</li>`};
  let h=Object.entries(groups).map(([d,l])=>`<h3>${esc(d)}</h3><ul class="sch">${l.map(row).join('')}</ul>`).join('');
  if(undated.length)h+=`<h3>Undated in feed</h3><ul class="sch">${undated.map(i=>`<li class="sch-row"><span class="sch-t">—</span><div class="sch-b"><b>${esc(i.title)}</b><small>${i.ep?'Episode '+esc(i.ep)+' · ':''}${esc(i.src)}</small></div></li>`).join('')}</ul>`;
  return h;
}

/* One tap skips ten seconds; each repeated tap adds another ten seconds. */
function seekByZone(zone){
  if(!PLAY||!PLAY.e||!['video','hls'].includes(PLAY.e.type))return;
  const v=$('#pv');if(!v)return;
  const side=zone.dataset.seek,delta=side==='left'?-10:10;
  const end=Number.isFinite(v.duration)?v.duration:Infinity;
  v.currentTime=Math.min(end,Math.max(0,(v.currentTime||0)+delta));
  const flash=$('#seek-flash');
  if(flash){flash.textContent=side==='left'?'−10 seconds ↶':'+10 seconds ↷';flash.classList.add('show');clearTimeout(flash._hideTimer);flash._hideTimer=setTimeout(()=>flash.classList.remove('show'),650)}
}
/* events */
document.addEventListener('click',async ev=>{
  const seekZone=ev.target.closest('.seek-zone');if(seekZone){seekByZone(seekZone);return}
  const n=ev.target.closest('.nav');if(n){view=n.dataset.v;PLAY=null;LIM=120;draw();scrollTo(0,0);return}
  const o=ev.target.closest('[data-open]');
  if(o&&!ev.target.closest('.bmc')){openTitle(o.dataset.open);return}
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,s=st.sources.find(x=>x.id===b.dataset.id);
  if(a==='fit'){FIT=FIT==='fit'?'fill':'fit';draw();return}
  if(a==='fullscr'){const el=$('#pv')||$('#view iframe');if(el&&el.requestFullscreen)el.requestFullscreen().catch(()=>toast('Fullscreen is blocked here.'));return}

  if(a==='providers-save'){
    try{
      PROVIDERS.forEach(p=>{
        const f=document.querySelector(`[name="provider:${p.id}"]`);
        if(f)st.providers[p.id]=f.value.trim()?SourceEngine.validateWebsite(f.value):'';
      });
    }catch(e){return toast(e.message)}
    save();toast('Provider addresses saved on this device.');render();return;
  }
  if(a==='provider-check-page'){await checkProviderPage(b.dataset.provider);return}
  if(a==='provider-open'||a==='provider-tab'){
    const p=PROVIDERS.find(x=>x.id===b.dataset.provider),u=p&&st.providers[p.id];
    if(!p||!u)return toast('Add a valid website address and save it first.');
    let target;
    try{target=SourceEngine.resolve(p.id,u).src}catch(e){return toast(e.message)}
    if(a==='provider-tab'){window.open(target,'_blank','noopener,noreferrer');return;}
    play(target,'provider:'+p.id,p.name,'',{externalProvider:true,sourceName:p.name,sourceAttribution:p.name});return;
  }

  if(a==='audio'){document.querySelector('#audio')?.remove();const e=entryFor(b.dataset.k);if(e)playEp(e,b.dataset.ep,b.dataset.a);return}
  if(a==='closeaudio'){document.querySelector('#audio')?.remove();return}
  if(a==='dl'){downloadEp(b.dataset.k,b.dataset.ep);return}
  if(a==='dlplay'){playDownload(b.dataset.id);return}
  if(a==='dldel'){deleteDownload(b.dataset.id);return}
  if(a==='dlclr'){if(confirm('Delete every saved episode on this device?'))clearDL();return}
  if(a==='snap'){download('ani-me-catalog.json',JSON.stringify(snapshot(),null,2));return}
  if(a==='sync'){if(!st.sources.length)return toast('Add a source first.');await runAll(st.sources.filter(s=>s.url));toast('Catalog synced.');render();return}
  if(a==='go'){view=b.dataset.v;LIM=120;if(b.dataset.s!==undefined)fsrc=b.dataset.s;draw();scrollTo(0,0)}
  if(a==='back'){if(history.state&&history.state.animeLog==='watch'){history.back()}else{view=view==='watch'&&entryFor(CUR)?'title':(prev||'home');PLAY=null;draw();scrollTo(0,0)}}
  if(a==='more'){LIM+=120;draw()}
  if(a==='fs'){fsrc=b.dataset.s;LIM=120;draw()}
  if(a==='scroll')b.parentElement.querySelector('.rail').scrollBy({left:+b.dataset.d*620,behavior:'smooth'});
  if(a==='wl'){const k=b.dataset.k,e=entryFor(k);if(wl(k))delete st.watch[k];else if(e)st.watch[k]={...snap(e),tag:'Plan to watch'};save();draw()}
  if(a==='tag'){if(st.watch[b.dataset.k]){st.watch[b.dataset.k].tag=b.dataset.t;save();draw()}}
  if(a==='ep'){const e=entryFor(CUR);if(e)playEp(e,b.dataset.ep)}
  if(a==='clrp'){delete st.seen[b.dataset.k];save();draw()}
  if(a==='playbest'){const e=entryFor(b.dataset.k);if(!e)return;const h=[...epsOf(e).keys()].sort((x,y)=>num(y)-num(x))[0];if(h)playEp(e,h);else openTitle(e.k)}
  if(a==='pl'){const e=entryFor(b.dataset.k);if(b.dataset.ep)markSeen(b.dataset.k,b.dataset.ep);play(b.dataset.u,b.dataset.k,e?e.title:'',b.dataset.ep||'',{sourceName:b.dataset.source||''}); }
  if(a==='srv')play(b.dataset.u,PLAY.k,PLAY.title,PLAY.ep,{audio:PLAY.audio,sourceName:b.dataset.source||''});
  if(a==='nextsource')tryNextSource(false);
  if(a==='share'){try{await navigator.clipboard.writeText(location.href.split('#')[0]);toast('Link copied.')}catch(e){toast('Copy the address from your browser.')}}
  if(a==='wsort'){WSORT=WSORT==='asc'?'desc':'asc';draw()}
  if(a==='wlist'){WLIST=!WLIST;draw()}
  if(a==='clrh'){st.hist=[];save();draw()}
  if(a==='refresh'){if(!st.sources.length)return toast('Add a source first.');await runAll(st.sources.filter(s=>s.url));toast('Sources refreshed.')}
  if(a==='reload'&&s)load(s);
  if(a==='del'&&s){st.sources=st.sources.filter(x=>x!==s);if(fsrc===s.name)fsrc='';save();draw()}
  if(a==='dropbad'){st.sources=st.sources.filter(x=>x.status!=='error');save();draw()}
  if(a==='dev'){st.device=b.dataset.d;save();applyDevice();draw()}
  if(a==='auto'){st.auto=st.auto===false;save();draw()}
  if(a==='quick'){const p=PRESETS[+b.dataset.i];if(st.sources.some(x=>x.name===p.name))return toast('Already added.');
    const ns={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),items:[],...p};if(p.providerId&&st.providers[p.providerId])ns.url=st.providers[p.providerId];st.sources.push(ns);load(ns)}
  if(a==='expwl')download('ani-me-watchlist.json',JSON.stringify({app:'ani-me-log',version:1,watch:Object.values(st.watch).map(w=>({title:w.title,image:w.image||'',tag:w.tag||'Plan to watch'})),seen:st.seen},null,2));
  if(a==='export')download('sources.json',JSON.stringify(st.sources.filter(x=>x.url).map(({name,url,body,pages,size,gap,adapter,adapterId,providerId})=>({name,url,body,pages,size,gap,adapter,adapterId,providerId})),null,2));
});
document.addEventListener('submit',async ev=>{
  if(ev.target.id==='yt'){ev.preventDefault();
    const m=ev.target.c.value.match(/UC[\w-]{22}/);if(!m)return toast('Paste a channel ID that starts with UC, or the channel’s feed link.');
    const nm='YouTube · '+(ev.target.n.value.trim()||m[0].slice(0,8));if(st.sources.some(x=>x.name===nm))return toast('Already added.');
    const ns={id:Date.now().toString(36),name:nm,url:'https://www.youtube.com/feeds/videos.xml?channel_id='+m[0],items:[]};
    st.sources.push(ns);ev.target.reset();load(ns);return}
  if(ev.target.id==='dm'){ev.preventDefault();
    const c=ev.target.c.value.trim().replace(/^.*dailymotion\.com\/(?!video)/i,'').replace(/[\/?#].*$/,'');
    if(!c)return;const nm='Dailymotion · '+c;if(st.sources.some(x=>x.name===nm))return toast('Already added.');
    const ns={id:Date.now().toString(36),name:nm,url:'https://api.dailymotion.com/user/'+encodeURIComponent(c)+'/videos?fields=id,title,thumbnail_480_url,url,created_time&limit=100',items:[]};
    st.sources.push(ns);ev.target.reset();load(ns);return}
  if(ev.target.id!=='add')return;ev.preventDefault();
  const f=ev.target,raw=f.raw.value.trim();let url=f.url.value.trim();
  if(url&&!/^[a-z]+:\/\//i.test(url))url='https://'+url;
  if(!url&&!raw)return toast('Enter an address or paste some data.');
  if(url&&st.sources.some(s=>s.url===url))return toast('That source is already added.');
  let name=f.name.value.trim();
  if(!name){try{name=url?new URL(url).hostname:'Pasted source'}catch(e){return toast('That address doesn’t look right.')}}
  let s=raw&&!url?st.sources.find(x=>x.raw!=null&&x.name===name):null;
  if(s)s.raw=raw;else{s={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name,url,items:[]};if(raw)s.raw=raw;st.sources.push(s)}
  f.reset();await load(s);
});
document.addEventListener('change',ev=>{
  const fl=ev.target.files&&ev.target.files[0];if(!fl)return;
  const r=new FileReader();
  if(ev.target.id==='file'){r.onload=()=>{const s={id:Date.now().toString(36),name:fl.name,url:'',raw:r.result,items:[]};st.sources.push(s);load(s)};r.readAsText(fl)}
  if(ev.target.id==='wlfile'){r.onload=()=>importWL(r.result);r.readAsText(fl)}
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='q'){q=ev.target.value;LIM=120;render()}
  if(ev.target.id==='proxy'){st.proxy=ev.target.value.trim();save()}
});

document.addEventListener('submit',ev=>{
  if(ev.target.id!=='prefs')return;ev.preventDefault();
  const f=ev.target,v=n=>(f.elements[n]||{}).value||'';
  Object.assign(st.prefs,{watchMode:v('watchMode')||'auto',watchSub:v('watchSub'),watchDub:v('watchDub'),dlSub:v('dlSub'),dlDub:v('dlDub'),quality:v('quality')||'720p',notify:!!(f.elements.notify&&f.elements.notify.checked)});
  st.prefs.enabled={};st.sources.forEach(s=>{const c=f.elements['en:'+s.name];st.prefs.enabled[s.name]=!!(c&&c.checked)});
  save();toast('Settings saved');render();
});

/* Browser and wrapped-app back navigation (Android system back maps to popstate). */
addEventListener('popstate',()=>{
  if(view==='watch'){view=entryFor(CUR)?'title':(prev||'home');PLAY=null;draw();scrollTo(0,0);return;}
  if(view==='title'){view=prev||'home';draw();scrollTo(0,0);return;}
  if(view!=='home'){view='home';PLAY=null;draw();scrollTo(0,0);}
});

/* device modes */
{const qd=new URLSearchParams(location.search).get('device');if(['win','mobile','tv'].includes(qd))st.device=qd}
function detectDevice(){
  if(/Tizen|Web0S|webOS|SmartTV|SMART-TV|Android TV|AndroidTV|AFT|BRAVIA|CrKey|Roku|HbbTV/i.test(navigator.userAgent))return'tv';
  if(innerWidth<700||(matchMedia('(pointer:coarse)').matches&&innerWidth<900))return'mobile';
  return'win';
}
function applyDevice(){
  DEV=st.device&&st.device!=='auto'?st.device:detectDevice();
  const c=document.body.classList;['dev-win','dev-mobile','dev-tv'].forEach(x=>c.remove(x));c.add('dev-'+DEV);
}
addEventListener('resize',()=>{if(!st.device||st.device==='auto')applyDevice()});
applyDevice();
document.addEventListener('keydown',ev=>{
  if(DEV!=='tv')return;
  const a=document.activeElement,typing=a&&/INPUT|TEXTAREA/.test(a.tagName);
  const k={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[ev.key];
  if(!k){
    if(ev.key==='Escape'||(ev.key==='Backspace'&&!typing)){ev.preventDefault();if(view==='watch'){view=entryFor(CUR)?'title':(prev||'home');PLAY=null;draw()}else if(view==='title'){view=prev||'home';draw()}else if(view!=='home'){view='home';draw()}}
    return;
  }
  if(typing&&k[0])return;
  const els=[...document.querySelectorAll('button:not([disabled]),a[href],input:not([readonly]),textarea')].filter(e=>e.offsetParent!==null);
  if(!a||!els.includes(a)){if(els[0])els[0].focus();ev.preventDefault();return}
  const r0=a.getBoundingClientRect(),cx=r0.left+r0.width/2,cy=r0.top+r0.height/2;
  let best=null,bs=1e9;
  els.forEach(e=>{
    if(e===a)return;const r=e.getBoundingClientRect(),x=r.left+r.width/2-cx,y=r.top+r.height/2-cy;
    const along=x*k[0]+y*k[1];if(along<=1)return;
    const sc=along+Math.abs(k[0]?y:x)*2.5;if(sc<bs){bs=sc;best=e}
  });
  if(best){best.focus();best.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});ev.preventDefault()}
});

/* start: pull the repo's sources.json, retire old broken entries, load what's empty */
const LEGACY=new Set(['https://api.jikan.moe/v4/top/anime','https://api.jikan.moe/v4/seasons/now','https://kitsu.io/api/edge/anime?sort=-userCount&page[limit]=20','https://kitsu.io/api/edge/anime?filter[status]=current&sort=-userCount&page[limit]=20','https://graphql.anilist.co']);
(async()=>{
  st.sources=st.sources.filter(s=>!(LEGACY.has(s.url)&&!s.pages));
  st.sources.forEach(s=>{if(s.status==='loading')s.status=''});
  try{
    const r=await fetch('sources.json',{cache:'no-store'});
    if(r.ok){const list=await r.json();
      (Array.isArray(list)?list:[]).forEach(x=>{
        if(!x||!/^https?:\/\//i.test(x.url||''))return;
        const have=st.sources.find(s=>s.name===x.name);
        if(have)Object.assign(have,{url:x.url,body:x.body,pages:x.pages,size:x.size,gap:x.gap,adapterId:x.adapterId||have.adapterId||'',adapter:x.adapter||have.adapter||'',providerId:x.providerId||have.providerId||''});
        else st.sources.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:x.name||new URL(x.url).hostname,url:x.url,body:x.body,pages:x.pages,size:x.size,gap:x.gap,adapterId:x.adapterId||'',adapter:x.adapter||'',providerId:x.providerId||'',items:[]});
      });
    }
  }catch(e){}
  save();draw();
  runAll(st.sources.filter(s=>s.url&&!(s.items||[]).length));
})();
loadDL();
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
