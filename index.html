<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140c0e">
<meta name="description" content="Ani-Me Log — your personal anime library and video player.">
<link rel="manifest" href="manifest.webmanifest">
<title>Ani-Me Log</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2C5 6 3 13 8 21c5-2 9-9 4-19z' fill='%23d98c8f'/%3E%3C/svg%3E">
<style>
:root{--bg:#140c0e;--side:#1a0f12;--card:#22151a;--line:#3b2629;--text:#f4e7e2;--mut:#a98f8b;--ac:#d98c8f;--ac2:#c99a62;--sel:#432a2e;--serif:Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:4px;padding:12px 32px;background:linear-gradient(#140c0ef5,#140c0ec0);backdrop-filter:blur(8px);border-bottom:1px solid #ffffff12}
.brand{display:flex;gap:10px;align-items:center;font:700 22px var(--serif);margin-right:22px;white-space:nowrap}
.brand small{display:block;font:400 11px "Segoe UI",sans-serif;color:var(--mut);line-height:1}
.nav{background:none;border:0;padding:8px 14px;color:var(--mut);cursor:pointer;font-size:16px;font-weight:600}
.nav:hover{color:var(--text)}
.nav.on{color:var(--text);box-shadow:inset 0 -3px var(--ac)}
.tools{margin-left:auto;display:flex;gap:10px;align-items:center}
.search{width:200px;background:#ffffff14;border:1px solid var(--line);border-radius:999px;padding:8px 16px;outline:0;transition:width .2s}
.search:focus{width:300px}
.btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#2a1216;font-weight:600}
.btn.sm{padding:5px 11px;font-size:13px}
.btn svg,.bmc svg{fill:none;stroke:currentColor;stroke-width:2}
.btn.on svg,.bmc.on svg{fill:currentColor}
.ptitle{padding:28px 32px 0}
.ptitle h1{margin:0;font:700 28px var(--serif)}
.ptitle p{margin:0;color:var(--mut);font-size:13px}
body.nohead .ptitle{display:none}
section{flex:1}
.page{padding:24px 32px}
.hero{position:relative;min-height:60vh;display:flex;align-items:center;gap:56px;padding:48px 32px 48px 8vw;overflow:hidden;border-bottom:1px solid var(--line)}
.hero::before{content:"";position:absolute;inset:-30px;background:var(--hb,none) center/cover,#2b1b18;filter:blur(28px);opacity:.5}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#140c0e 5%,#140c0e55 55%,#140c0e99),linear-gradient(0deg,#140c0e,transparent 30%)}
.hero>*{position:relative;z-index:1}
.hero img{height:min(52vh,460px);aspect-ratio:2/3;object-fit:cover;border-radius:6px;box-shadow:0 18px 50px #000a}
.hero h2{margin:0 0 12px;font:700 clamp(34px,5vw,64px)/1.05 var(--serif);max-width:14ch}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.rows{padding:10px 32px 20px}
.rh{margin:26px 0 12px;font:700 22px var(--serif)}
.rh button{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
.rh button:hover{color:var(--ac)}
.rw{position:relative}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;padding:4px 2px 10px}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:0 0 170px}
.ar{position:absolute;top:28%;z-index:2;width:38px;height:70px;border:0;background:#140c0ee0;color:var(--text);font-size:26px;cursor:pointer;border-radius:8px}
.ar.l{left:-14px}.ar.r{right:-14px}
.ar:hover{background:var(--sel)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px;margin-bottom:30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative}
.card .open{display:block;width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.card:hover{border-color:var(--ac)}
.poster{aspect-ratio:2/3;background:#2e1c20;position:relative;display:grid;place-items:center;font:40px var(--serif);color:var(--ac)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bmc{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:#140c0ecc;color:var(--ac);cursor:pointer;display:grid;place-items:center}
.cb{padding:10px 12px}
.cb b{display:block;font-size:14px;line-height:1.3}
.cb small{color:var(--mut);font-size:12px}
.tag{display:inline-block;background:var(--sel);border-radius:6px;padding:1px 7px;margin:4px 4px 0 0;font-size:11px}
.tag.hi{background:var(--ac);color:#2a1216}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 14px;cursor:pointer;color:var(--mut);font-size:13px}
.chip.on{background:var(--sel);color:var(--text);border-color:var(--ac)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:24px}
h3{margin:0;font:700 19px var(--serif)}
.panel h3{margin-bottom:14px}
.panel form{display:grid;gap:10px}
.panel form.row{display:flex}
.panel input,.panel textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.note{color:var(--mut);font-size:13px;margin:0 0 10px}
.src{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.src:first-of-type{border-top:0}
.src div{flex:1;min-width:0}
.src small{display:block;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.err{color:#f0a08f!important;white-space:normal!important}
.empty{color:var(--mut);padding:40px 0;text-align:center}
.sy{display:flex;gap:32px;align-items:flex-start;margin:6px 0 28px}
.sy img{width:220px;aspect-ratio:2/3;object-fit:cover;border-radius:8px;box-shadow:0 14px 40px #0009;flex:none}
.sy h1{margin:0 0 8px;font:700 clamp(28px,4vw,46px)/1.1 var(--serif)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.syn{max-width:70ch;color:#dccbc5;margin:12px 0 16px}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:10px;margin-bottom:28px}
.ep{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 6px;cursor:pointer;text-align:center;font-weight:600;position:relative}
.ep small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.ep:hover{border-color:var(--ac)}
.ep.seen{opacity:.5;background:#1a1012}.ep.seen:hover{opacity:.9}
.ep.cur{background:var(--ac);color:#2a1216;border-color:var(--ac);opacity:1}
.wt{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.epc{display:flex;flex-wrap:wrap;gap:10px}
.epc .ep{width:46px;height:46px;border-radius:50%;padding:0;display:grid;place-items:center}
.epc .ep.seen::after{content:none}
.eprs{display:grid;gap:8px;max-height:420px;overflow:auto}
.epr{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
.epr small{display:block;color:var(--mut);font-size:12px}
.epr.seen{opacity:.5}.epr.seen:hover{opacity:.9}.epr.cur{border-color:var(--ac);opacity:1}
.rec{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;padding:8px 0;cursor:pointer;text-align:left}
.rec .rp{width:54px;aspect-ratio:2/3;background:#2e1c20;border-radius:6px;overflow:hidden;flex:none}
.rec img{width:100%;height:100%;object-fit:cover}
.rec b{display:block;font-size:14px}.rec small{color:var(--mut)}
@media(max-width:900px){.wt{grid-template-columns:1fr}}
.ep.seen::after{content:"✓";position:absolute;top:3px;right:7px;font-size:11px;color:var(--ac2)}
.ep.off{opacity:.25;cursor:default;border-style:dashed}
.fl{list-style:none;margin:0 0 24px;padding:0}
.fl li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.fl div{flex:1;min-width:0}
.fl small{display:block;color:var(--mut)}
.vid{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin-bottom:14px;display:grid;place-items:center;position:relative;box-shadow:0 16px 42px #0008}
.vid iframe,.vid video{width:100%;height:100%;border:0;display:block;background:#000}
.vid video{object-fit:contain}
.vid iframe{color-scheme:dark}
.play-sources{margin:8px 0 14px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#ffffff06}
.play-sources summary{cursor:pointer;color:var(--mut);font-size:13px;user-select:none}
.play-sources .chips{margin:10px 0 0}
.player-title{font-weight:600;text-align:center;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:600px){.vid{border-radius:8px}.player-title{max-width:100%;font-size:13px}}
.phd{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
footer{padding:20px 32px;border-top:1px solid var(--line);color:var(--mut);font-size:13px;text-align:center;letter-spacing:.04em}
dialog{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(1000px,96vw);max-height:94vh}
dialog::backdrop{background:#000c}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--sel);border:1px solid var(--ac);padding:10px 18px;border-radius:10px;display:none;z-index:99}
.tabs{display:contents}
.dev-mobile{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
.dev-mobile .top{flex-wrap:wrap;padding:10px 14px}
.dev-mobile .brand{margin-right:auto;font-size:20px}
.dev-mobile .tools{width:100%;margin:0}
.dev-mobile .search,.dev-mobile .search:focus{flex:1;width:auto;min-height:44px}
.dev-mobile .tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;overflow-x:auto;background:#140c0ef8;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.dev-mobile .tabs .nav{flex:1 0 auto;min-width:66px;min-height:56px;padding:6px 10px;font-size:12px;box-shadow:none}
.dev-mobile .tabs .nav.on{box-shadow:inset 0 3px var(--ac)}
.dev-mobile .btn{min-height:44px}
.dev-mobile .page,.dev-mobile .rows,.dev-mobile .ptitle{padding-left:14px;padding-right:14px}
.dev-mobile .hero{min-height:42vh;padding:28px 16px;gap:0}
.dev-mobile .hero img,.dev-mobile .ar{display:none}
.dev-mobile .rail .card{flex-basis:128px}
.dev-mobile .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.dev-mobile .bmc{width:40px;height:40px}
.dev-mobile dialog{width:98vw;padding:14px}
.dev-mobile .sy{flex-direction:column;gap:16px}.dev-mobile .sy img{width:140px}
.dev-tv{zoom:1.3}
.dev-tv .top,.dev-tv .page,.dev-tv .rows,.dev-tv .ptitle,.dev-tv footer{padding-left:5vw;padding-right:5vw}
.dev-tv .ar,.dev-tv .petal{display:none}
.dev-tv .hero{min-height:56vh}
.dev-tv .rail .card{flex-basis:190px}
.dev-tv .card{transition:transform .15s,border-color .15s}
.dev-tv .card:has(:focus-visible){transform:scale(1.07);border-color:var(--ac2);z-index:2}
.dev-tv :focus-visible{outline:4px solid var(--ac2);outline-offset:3px}
.petal{position:fixed;top:-8vh;z-index:3;pointer-events:none;border-radius:100% 0 100% 0;opacity:.5;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(55px,55vh) rotate(200deg)}100%{transform:translate(-35px,115vh) rotate(380deg)}}
@media(prefers-reduced-motion:reduce){.petal{display:none}}
</style>
</head>
<body>
<nav class="top">
  <div class="brand"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C5 6 3 13 8 21c5-2 9-9 4-19z" fill="#d98c8f"/><path d="M12 2c3 6 1 13-4 19" fill="none" stroke="#7a4a43" stroke-width="1"/></svg><div>Ani-Me Log<small>beta</small></div></div>
  <div class="tabs">
  <button class="nav" data-v="home">Home</button>
  <button class="nav" data-v="library">Library</button>
  <button class="nav" data-v="latest">Latest</button>
  <button class="nav" data-v="watchlist">Watchlist</button>
  <button class="nav" data-v="history">History</button>
  <button class="nav" data-v="sources">Settings</button>
  </div>
  <div class="tools"><input class="search" id="q" type="search" placeholder="Search" aria-label="Search titles"><button class="btn sm" data-act="refresh">Refresh</button></div>
</nav>
<div class="ptitle"><h1 id="ttl">Home</h1><p id="sub"></p></div>
<section id="view"></section>
<footer>thewiltedpetals.blooms</footer>
<div id="toast" role="status"></div>
<script>
const K='animelog.v1',$=s=>document.querySelector(s);
let st={sources:[],proxy:'',auto:true,watch:{},hist:[],seen:{},device:'auto'},view='home',prev='home',CUR='',q='',fsrc='',LIM=120,LIB={map:new Map(),list:[]},PLAY=null,DEV='win',HLSP=null,WSORT='asc',WLIST=false;
try{Object.assign(st,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(st))}catch(e){toast('Browser storage is full, so this session won’t be cached.')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https?:\/\//i.test(u||'')?esc(u):'';
const sleep=t=>new Promise(r=>setTimeout(r,t));
const ago=t=>{const m=Math.round((Date.now()-t)/60000);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' days ago'};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)}
const num=x=>parseFloat(x)||0;

/* hidden duplicate scanner */
const norm=t=>String(t).normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
  .replace(/[(\[][^)\]]*(dub|sub|raw|uncensored)[^)\]]*[)\]]/g,' ')
  .replace(/\b(english dub|dubbed|subbed|uncensored)\b/g,' ')
  .replace(/[^a-z0-9]+/g,' ').trim();

/* sub / dub labels from titles and source names */
function subs(raw,src){
  const o=new Set(),all=raw+' '+src;
  String(raw).replace(/\b(english|indo(?:nesian)?|spanish|portuguese|arabic|thai|vietnamese|malay|french|german|italian|russian|turkish|hindi|chinese)\s+(sub|dub)s?\b/gi,(m,l,t)=>{l=/^indo/i.test(l)?'Indo':l[0].toUpperCase()+l.slice(1).toLowerCase();o.add(l+' '+t.toLowerCase())});
  if(!o.size){if(/\bdub(bed)?\b/i.test(all))o.add('Dub');if(/\bsub(bed|s)?\b/i.test(all))o.add('Sub');if(/\braw\b/i.test(all))o.add('Raw')}
  return[...o];
}

/* parsing */
const get=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const first=(o,ps)=>{for(const p of ps){const v=get(o,p);if(v&&typeof v!=='object')return v}return ''};
const toMs=v=>typeof v==='number'?v*1000:(Date.parse(v)||0);
const big=u=>(u||'').replace(/\/s\d+(-c)?\//,'/s400/');
const plain=s=>String(s||'').replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim().slice(0,700);
function clean(t){
  t=String(t).trim();let ep='';
  const sm=t.match(/^Episode\s+(\d+(?:[-–]\d+)?)\s+of\s+(.+?)\s+is\s+out!?$/i);
  if(sm)return{title:sm[2].trim(),ep:sm[1]};
  const m=t.match(/\b(?:episode|eps?\.?)\s*(\d+)/i);
  if(m){ep=m[1];t=t.slice(0,m.index)}
  t=t.replace(/\s*\[[^\]]*\]/g,'').replace(/\s*[–-]\s*(english|indo)[^]*$/i,'').trim();
  return{title:t||String(t),ep};
}
function titleAliases(o){
  const out=new Set(), add=v=>{if(typeof v==='string'&&v.trim())out.add(v.trim())};
  if(!o||typeof o!=='object')return[];
  const t=o.title;
  if(t&&typeof t==='object'){add(t.english);add(t.romaji);add(t.native);add(t.userPreferred)}
  ['title_english','title_japanese','english','romaji','canonicalTitle'].forEach(k=>add(o[k]));
  ['titles','synonyms','abbreviatedTitles'].forEach(k=>{
    const a=o[k];if(Array.isArray(a))a.forEach(v=>add(typeof v==='string'?v:(v&& (v.title||v.name))));
  });
  const a=o.attributes;
  if(a&&typeof a==='object'){
    add(a.canonicalTitle);
    [a.titles,a.abbreviatedTitles].forEach(xs=>{if(xs&&typeof xs==='object')Object.values(xs).forEach(add)});
  }
  if(Array.isArray(o.title))o.title.forEach(v=>add(typeof v==='string'?v:v&&v.title));
  return[...out];
}
function mapItem(o){
  if(typeof o==='string')return{title:o.trim(),raw:o.trim(),aliases:[]};
  if(!o||typeof o!=='object')return null;
  const raw=first(o,['title','name','title.english','title.romaji','title_english','attributes.canonicalTitle']);
  if(!raw)return null;
  const c=clean(raw);
  let sc=num(first(o,['score','averageScore','attributes.averageRating']));if(sc>10)sc/=10;
  const video=first(o,['videoUrl','video_url','streamUrl','stream_url','playUrl','play_url','embedUrl','embed_url','episodeUrl','episode_url','attributes.videoUrl','attributes.streamUrl']);
  return{title:c.title,raw:String(raw),aliases:titleAliases(o),
    image:first(o,['image','img','poster','cover','thumbnail','thumbnail_480_url','images.jpg.image_url','coverImage.large','attributes.posterImage.small'])||(o.identifier?'https://archive.org/services/img/'+o.identifier:''),
    link:first(o,['url','siteUrl','link','href'])||(o.attributes&&o.attributes.slug?'https://kitsu.io/anime/'+o.attributes.slug:'')||(o.identifier?'https://archive.org/details/'+o.identifier:''),
    video:typeof video==='string'?video:'',ep:c.ep||first(o,['episode','ep','latest_episode']),
    date:toMs(first(o,['date','published','updated_at','aired.from','attributes.startDate','created_at','created_time'])),
    desc:plain(first(o,['synopsis','description','summary','attributes.synopsis'])),
    tags:(Array.isArray(o.genres)?o.genres.map(g=>typeof g==='string'?g:g&&g.name).filter(Boolean):[]).slice(0,6),
    total:num(first(o,['episodes','attributes.episodeCount','episodeCount'])),score:sc};
}
function findList(d,dep=0){
  if(Array.isArray(d))return d;
  if(!d||typeof d!=='object'||dep>4)return[];
  if(d.response&&typeof d.response==='object'){const r=findList(d.response,dep+1);if(r.length)return r}
  for(const k of ['data','items','results','anime','entries','list','media','series','docs'])if(Array.isArray(d[k]))return d[k];
  for(const v of Object.values(d)){const r=findList(v,dep+1);if(r.length)return r}
  return[];
}
function parseXML(txt){
  const x=new DOMParser().parseFromString(txt,'text/xml');
  if(x.querySelector('parsererror'))throw new Error('Not valid JSON or RSS/Atom');
  return[...x.querySelectorAll('item,entry')].map(n=>{
    const g=t=>n.querySelector(t)?.textContent?.trim()||'';
    const l=n.querySelector('link'),th=n.getElementsByTagName('media:thumbnail')[0]||n.querySelector('enclosure');
    const raw=g('title'),c=clean(raw);
    return{title:c.title,raw,ep:c.ep,link:l?(l.getAttribute('href')||l.textContent.trim()):'',image:big(th?.getAttribute('url')),date:Date.parse(g('pubDate')||g('published')||g('updated'))||0};
  }).filter(i=>i.title);
}
function parseText(txt){
  let d;try{d=JSON.parse(txt)}catch(e){return parseXML(txt)}
  return findList(d).map(mapItem).filter(Boolean);
}

/* network: direct first, then (optionally) a background proxy scout that remembers what works */
const PROXIES=[u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),u=>'https://corsproxy.io/?url='+encodeURIComponent(u),u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u)];
const BAD=new Set();
async function req(a){
  const o={};
  if(AbortSignal.timeout)o.signal=AbortSignal.timeout(14000);
  if(a.body)Object.assign(o,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(a.body)});
  const r=await fetch(a.url,o);
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.text();
}
async function grab(u,body){
  const host=new URL(u).hostname,list=[];
  if(st.proxy)list.push({url:st.proxy+encodeURIComponent(u),body});
  else if(!BAD.has(host)){list.push({url:u,body});if(body&&body.query)list.push({url:u+'?query='+encodeURIComponent(body.query)})}

function build(){
  const m=new Map(),keys=new Map();
  const addKey=(key,e)=>{if(!key)return;const old=keys.get(key);if(old&&old!==e)return old;keys.set(key,e);m.set(e.k,e);return e};
  st.sources.forEach(s=>(s.items||[]).forEach((i,idx)=>{
    const names=[i.title,...(i.aliases||[])].filter(Boolean),norms=[...new Set(names.map(norm).filter(k=>k.length>=4))];
    const found=norms.map(k=>keys.get(k)).find(Boolean);
    const primary=norm(i.title);if(!primary)return;
    let e=found;
    if(!e){e={k:primary,title:i.title,image:i.image,ep:i.ep,date:i.date||0,ord:idx,desc:'',tags:[],total:0,score:0,aliases:[],from:[]};m.set(e.k,e)}
    else if(i.title&&i.title.length>e.title.length&&(!e.title||e.title.length<4))e.title=i.title;
    e.image=e.image||i.image;if(num(i.ep)>num(e.ep))e.ep=i.ep;e.date=Math.max(e.date,i.date||0);e.ord=Math.min(e.ord,idx);
    if((i.desc||'').length>e.desc.length)e.desc=i.desc;
    (i.tags||[]).forEach(t=>{if(t&&!e.tags.includes(t))e.tags.push(t)});
    e.total=Math.max(e.total,i.total||0);e.score=Math.max(e.score,i.score||0);
    names.forEach(n=>{if(n&&norm(n)!==norm(e.title)&&!e.aliases.includes(n))e.aliases.push(n);addKey(norm(n),e)});
    const raw=i.raw||i.title,video=i.video||'';
    if(!e.from.some(f=>f.src===s.name&&f.raw===raw&&f.ep===i.ep&&f.link===i.link&&f.video===video))

}

/* embeds and playback */
function embedFor(u){
  let m;
  if((m=u.match(/dailymotion\.com\/(?:embed\/)?video\/([a-z0-9]+)/i))||(m=u.match(/dai\.ly\/([a-z0-9]+)/i)))return{type:'frame',src:'https://www.dailymotion.com/embed/video/'+m[1]};
  if(/rumble\.com\/embed\//i.test(u))return{type:'frame',src:u};
  if((m=u.match(/(?:youtube\.com\/watch\?(?:[^#]*&)?v=|youtu\.be\/)([\w-]{11})/i)))return{type:'frame',src:'https://www.youtube-nocookie.com/embed/'+m[1]};
  if((m=u.match(/archive\.org\/(?:details|embed)\/([^/?#]+)/i)))return{type:'frame',src:'https://archive.org/embed/'+m[1]};
  if(/\.m3u8(?:[?#]|$)/i.test(u))return{type:'hls',src:u};
  if(/\.(mp4|webm|ogg)(?:[?#]|$)/i.test(u))return{type:'video',src:u};
  if(/rumble\.com\//i.test(u))return{type:'rumble',src:u};
  if(/^https?:\/\//i.test(u))return{type:'page',src:u};
  return null;
}

function draw(){
  LIB=build();const L=LIB.list;
  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const needle=norm(q);
  const flt=a=>{let r=a;if(fsrc)r=r.filter(e=>e.from.some(f=>f.src===fsrc));if(needle)r=r.filter(e=>norm(e.title).includes(needle));return r};
  const latest=[...L].sort((a,b)=>(b.date-a.date)||(a.ord-b.ord));
  const W=Object.values(st.watch).reverse().map(x=>LIB.map.get(x.k)||x),H=st.hist.map(x=>LIB.map.get(x.k)||x);
  let h='',T=['',''];
  if(view==='watch'){h=PLAY?wview():'<div class="page"><p class="empty">Nothing playing.</p></div>';T=['Watch','']}
  else if(view==='title'){const e=entryFor(CUR);h=e?tview(e,L):'<div class="page"><p class="empty">Title not found.</p></div>';T=['Title','']}
  else if(view==='home'){
    T=['Home',''];
    const hero=latest.find(e=>e.image)||latest[0];
    if(needle)h=`<div class="page"><h3 style="margin-bottom:14px">Results</h3>${grid(flt(L).slice(0,LIM),'No titles match your search.')}${more(flt(L))}</div>`;
    else{
      h=hero?`<div class="hero" style="--hb:url('${safe(hero.image).replace(/'/g,'%27')}')">${hero.image?`<img src="${safe(hero.image)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:''}<div><h2>${esc(hero.title)}</h2>
<p class="note">${hero.ep?`Episode ${esc(hero.ep)} · `:''}On ${new Set(hero.from.map(f=>f.src)).size} source(s)</p>
<div class="row"><button class="btn pri" data-act="playbest" data-k="${esc(hero.k)}">▶ Play</button><button class="btn" data-open="${esc(hero.k)}">Synopsis</button>${bmBtn(hero.k)}</div></div></div>`
      :`<div class="hero"><div><h2>Add your first source</h2><p class="note">Add a site or feed and Ani-Me Log lists what it has.</p><button class="btn pri" data-act="go" data-v="sources">Open Settings</button></div></div>`;
      h+=`<div class="rows">`+(latest.length?rail('Latest','latest',latest.slice(0,24)):'');
      if(W.length)h+=rail('Watchlist','watchlist',W.slice(0,24));
      if(H.length)h+=rail('History','history',H.slice(0,24));
      st.sources.slice(0,8).forEach(x=>{const l=L.filter(e=>e.from.some(f=>f.src===x.name)).slice(0,24);if(l.length)h+=rail('From '+x.name,'library',l,x.name)});
      h+=`</div>`;
    }
  }else if(view==='library'){const f=flt(L);T=['Library',`${f.length} titles`];h=chips()+grid(f.slice(0,LIM),'No titles yet. Add a source under Settings.')+more(f)}
  else if(view==='latest'){const f=flt(latest);T=['Latest','Newest first'];h=chips()+grid(f.slice(0,LIM),'No titles yet. Add a source under Settings.')+more(f)}
  else if(view==='watchlist'){const f=flt(W);T=['Watchlist',`${W.length} saved`];h=grid(f,'Tap the bookmark on any title to save it here.')}
  else if(view==='history'){const f=flt(H);T=['History','Recently opened'];h=(H.length?`<div class="row" style="margin-bottom:16px"><button class="btn sm" data-act="clrh">Clear history</button></div>`:'')+grid(f,'Titles you open will appear here.')}
  else{T=['Settings','Sources, network and backup'];h=srcView()}
  if(view!=='home'&&view!=='title'&&view!=='watch')h=`<div class="page">${h}</div>`;
  document.body.classList.toggle('nohead',view==='home'||view==='title'||view==='watch');
  $('#ttl').textContent=T[0];$('#sub').textContent=T[1];
  if(document.activeElement?.id==='proxy')return;
  const sig=view==='watch'&&PLAY?[PLAY.k,PLAY.ep,PLAY.url,PLAY.e&&PLAY.e.src,WSORT,WLIST,wl(PLAY.k),Object.keys((st.seen[PLAY.k]||{eps:{}}).eps).length].join('|'):'',vw=$('#view');
  if(sig&&vw.dataset.w===sig&&vw.querySelector('.vid iframe,.vid video'))return;
  vw.dataset.w=sig;vw.innerHTML=h;attachHls();
  if(DEV==='tv'&&document.activeElement===document.body){const f=$('#view .btn.pri,#view .open');if(f)f.focus({preventScroll:true})}
}
let rq=0;function render(){cancelAnimationFrame(rq);rq=requestAnimationFrame(draw)}
function openTitle(k){
  const e=entryFor(k);if(!e)return;
  if(view!=='title'&&view!=='watch')prev=view;PLAY=null;CUR=k;view='title';
  st.hist=[snap(e),...st.hist.filter(h=>h.k!==e.k)].slice(0,100);save();draw();scrollTo(0,0);
}
const download=(name,txt)=>{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));l.download=name;l.click()};
function importWL(txt){
  let n=0;
  const add=(t,tag,img)=>{t=String(t||'').trim();if(!t)return;const k=norm(t);if(!k||st.watch[k])return;st.watch[k]={k,title:t,image:img||'',ep:'',from:[],tag:tag||'Plan to watch'};n++};
  try{const d=JSON.parse(txt),a=Array.isArray(d)?d:(d.watch||d.items||d.list||[]);
    a.forEach(x=>typeof x==='string'?add(x):add(x.title||x.name,x.tag,x.image));
    if(d&&d.seen&&typeof d.seen==='object')Object.keys(d.seen).forEach(k=>{if(!st.seen[k])st.seen[k]=d.seen[k]});
  }catch(e){txt.split(/\r?\n/).forEach(l=>add(l.replace(/^[-*•\s]+/,'')))}
  save();draw();toast(n+' added to your watchlist.');
}

/* events */
document.addEventListener('click',async ev=>{
  const n=ev.target.closest('.nav');if(n){view=n.dataset.v;PLAY=null;LIM=120;draw();scrollTo(0,0);return}
  const o=ev.target.closest('[data-open]');
  if(o&&!ev.target.closest('.bmc')){openTitle(o.dataset.open);return}
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,s=st.sources.find(x=>x.id===b.dataset.id);
  if(a==='go'){view=b.dataset.v;LIM=120;if(b.dataset.s!==undefined)fsrc=b.dataset.s;draw();scrollTo(0,0)}
  if(a==='back'){if(history.state&&history.state.animeLog==='watch'){history.back()}else{view=view==='watch'&&entryFor(CUR)?'title':(prev||'home');PLAY=null;draw();scrollTo(0,0)}}
  if(a==='more'){LIM+=120;draw()}
  if(a==='fs'){fsrc=b.dataset.s;LIM=120;draw()}
  if(a==='scroll')b.parentElement.querySelector('.rail').scrollBy({left:+b.dataset.d*620,behavior:'smooth'});
  if(a==='wl'){const k=b.dataset.k,e=entryFor(k);if(wl(k))delete st.watch[k];else if(e)st.watch[k]={...snap(e),tag:'Plan to watch'};save();draw()}
  if(a==='tag'){if(st.watch[b.dataset.k]){st.watch[b.dataset.k].tag=b.dataset.t;save();draw()}}
  if(a==='ep'){const e=entryFor(CUR);if(e)playEp(e,b.dataset.ep)}
  if(a==='clrp'){delete st.seen[b.dataset.k];save();draw()}
  if(a==='playbest'){const e=entryFor(b.dataset.k);if(!e)return;const h=[...epsOf(e).keys()].sort((x,y)=>num(y)-num(x))[0];if(h)playEp(e,h);else openTitle(e.k)}
  if(a==='pl'){const e=entryFor(b.dataset.k);if(b.dataset.ep)markSeen(b.dataset.k,b.dataset.ep);play(b.dataset.u,b.dataset.k,e?e.title:'',b.dataset.ep||''); }
  if(a==='srv')play(b.dataset.u,PLAY.k,PLAY.title,PLAY.ep);
  if(a==='share'){try{await navigator.clipboard.writeText(location.href.split('#')[0]);toast('Link copied.')}catch(e){toast('Copy the address from your browser.')}}
  if(a==='wsort'){WSORT=WSORT==='asc'?'desc':'asc';draw()}
  if(a==='wlist'){WLIST=!WLIST;draw()}
  if(a==='clrh'){st.hist=[];save();draw()}
  if(a==='refresh'){if(!st.sources.length)return toast('Add a source first.');await runAll(st.sources.filter(s=>s.url));toast('Sources refreshed.')}
  if(a==='reload'&&s)load(s);
  if(a==='del'&&s){st.sources=st.sources.filter(x=>x!==s);if(fsrc===s.name)fsrc='';save();draw()}
  if(a==='dropbad'){st.sources=st.sources.filter(x=>x.status!=='error');save();draw()}
  if(a==='dev'){st.device=b.dataset.d;save();applyDevice();draw()}
  if(a==='auto'){st.auto=st.auto===false;save();draw()}
  if(a==='quick'){const p=PRESETS[+b.dataset.i];if(st.sources.some(x=>x.name===p.name))return toast('Already added.');
    const ns={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),items:[],...p};st.sources.push(ns);load(ns)}
  if(a==='expwl')download('ani-me-watchlist.json',JSON.stringify({app:'ani-me-log',version:1,watch:Object.values(st.watch).map(w=>({title:w.title,image:w.image||'',tag:w.tag||'Plan to watch'})),seen:st.seen},null,2));
  if(a==='export')download('sources.json',JSON.stringify(st.sources.filter(x=>x.url).map(({name,url,body,pages,size,gap})=>({name,url,body,pages,size,gap})),null,2));
});
document.addEventListener('submit',async ev=>{
  if(ev.target.id==='yt'){ev.preventDefault();
    const m=ev.target.c.value.match(/UC[\w-]{22}/);if(!m)return toast('Paste a channel ID that starts with UC, or the channel’s feed link.');
    const nm='YouTube · '+(ev.target.n.value.trim()||m[0].slice(0,8));if(st.sources.some(x=>x.name===nm))return toast('Already added.');
    const ns={id:Date.now().toString(36),name:nm,url:'https://www.youtube.com/feeds/videos.xml?channel_id='+m[0],items:[]};
    st.sources.push(ns);ev.target.reset();load(ns);return}
  if(ev.target.id==='dm'){ev.preventDefault();
    const c=ev.target.c.value.trim().replace(/^.*dailymotion\.com\/(?!video)/i,'').replace(/[\/?#].*$/,'');
    if(!c)return;const nm='Dailymotion · '+c;if(st.sources.some(x=>x.name===nm))return toast('Already added.');
    const ns={id:Date.now().toString(36),name:nm,url:'https://api.dailymotion.com/user/'+encodeURIComponent(c)+'/videos?fields=id,title,thumbnail_480_url,url,created_time&limit=100',items:[]};
    st.sources.push(ns);ev.target.reset();load(ns);return}
  if(ev.target.id!=='add')return;ev.preventDefault();
  const f=ev.target,raw=f.raw.value.trim();let url=f.url.value.trim();
  if(url&&!/^[a-z]+:\/\//i.test(url))url='https://'+url;
  if(!url&&!raw)return toast('Enter an address or paste some data.');
  if(url&&st.sources.some(s=>s.url===url))return toast('That source is already added.');
  let name=f.name.value.trim();
  if(!name){try{name=url?new URL(url).hostname:'Pasted source'}catch(e){return toast('That address doesn’t look right.')}}
  let s=raw&&!url?st.sources.find(x=>x.raw!=null&&x.name===name):null;
  if(s)s.raw=raw;else{s={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name,url,items:[]};if(raw)s.raw=raw;st.sources.push(s)}
  f.reset();await load(s);
});
document.addEventListener('change',ev=>{
  const fl=ev.target.files&&ev.target.files[0];if(!fl)return;
  const r=new FileReader();
  if(ev.target.id==='file'){r.onload=()=>{const s={id:Date.now().toString(36),name:fl.name,url:'',raw:r.result,items:[]};st.sources.push(s);load(s)};r.readAsText(fl)}
  if(ev.target.id==='wlfile'){r.onload=()=>importWL(r.result);r.readAsText(fl)}
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='q'){q=ev.target.value;LIM=120;render()}
  if(ev.target.id==='proxy'){st.proxy=ev.target.value.trim();save()}
});

/* device modes */
{const qd=new URLSearchParams(location.search).get('device');if(['win','mobile','tv'].includes(qd))st.device=qd}
function detectDevice(){
  if(/Tizen|Web0S|webOS|SmartTV|SMART-TV|Android TV|AndroidTV|AFT|BRAVIA|CrKey|Roku|HbbTV/i.test(navigator.userAgent))return'tv';
  if(innerWidth<700||(matchMedia('(pointer:coarse)').matches&&innerWidth<900))return'mobile';
  return'win';
}
function applyDevice(){
  DEV=st.device&&st.device!=='auto'?st.device:detectDevice();
  const c=document.body.classList;['dev-win','dev-mobile','dev-tv'].forEach(x=>c.remove(x));c.add('dev-'+DEV);
}
addEventListener('resize',()=>{if(!st.device||st.device==='auto')applyDevice()});
applyDevice();
document.addEventListener('keydown',ev=>{
  if(DEV!=='tv')return;
  const a=document.activeElement,typing=a&&/INPUT|TEXTAREA/.test(a.tagName);
  const k={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[ev.key];
  if(!k){
    if(ev.key==='Escape'||(ev.key==='Backspace'&&!typing)){ev.preventDefault();if(view==='watch'){view=entryFor(CUR)?'title':(prev||'home');PLAY=null;draw()}else if(view==='title'){view=prev||'home';draw()}else if(view!=='home'){view='home';draw()}}
    return;
  }
  if(typing&&k[0])return;
  const els=[...document.querySelectorAll('button:not([disabled]),a[href],input:not([readonly]),textarea')].filter(e=>e.offsetParent!==null);
  if(!a||!els.includes(a)){if(els[0])els[0].focus();ev.preventDefault();return}
  const r0=a.getBoundingClientRect(),cx=r0.left+r0.width/2,cy=r0.top+r0.height/2;
  let best=null,bs=1e9;
  els.forEach(e=>{
    if(e===a)return;const r=e.getBoundingClientRect(),x=r.left+r.width/2-cx,y=r.top+r.height/2-cy;
    const along=x*k[0]+y*k[1];if(along<=1)return;
    const sc=along+Math.abs(k[0]?y:x)*2.5;if(sc<bs){bs=sc;best=e}
  });
  if(best){best.focus();best.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});ev.preventDefault()}
});

(()=>{const c=['#d98c8f','#b9686f','#c99a62','#8a5a4a','#e3b0a6'];

    document.body.appendChild(p)}})();

/* start: pull the repo's sources.json, retire old broken entries, load what's empty */
const LEGACY=new Set(['https://api.jikan.moe/v4/top/anime','https://api.jikan.moe/v4/seasons/now','https://kitsu.io/api/edge/anime?sort=-userCount&page[limit]=20','https://kitsu.io/api/edge/anime?filter[status]=current&sort=-userCount&page[limit]=20','https://graphql.anilist.co']);
(async()=>{
  st.sources=st.sources.filter(s=>!(LEGACY.has(s.url)&&!s.pages));
  st.sources.forEach(s=>{if(s.status==='loading')s.status=''});
  try{
    const r=await fetch('sources.json',{cache:'no-store'});
    if(r.ok){const list=await r.json();
      (Array.isArray(list)?list:[]).forEach(x=>{
        if(!x||!/^https?:\/\//i.test(x.url||''))return;
        const have=st.sources.find(s=>s.name===x.name);
        if(have)Object.assign(have,{url:x.url,body:x.body,pages:x.pages,size:x.size,gap:x.gap});
        else st.sources.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:x.name||new URL(x.url).hostname,url:x.url,body:x.body,pages:x.pages,size:x.size,gap:x.gap,items:[]});
      });
    }
  }catch(e){}
  save();draw();
  runAll(st.sources.filter(s=>s.url&&!(s.items||[]).length));
})();
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
