<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ani-Me Log</title>
<style>
:root{--bg:#140c0e;--side:#1a0f12;--card:#22151a;--line:#3b2629;--text:#f4e7e2;--mut:#a98f8b;--ac:#d98c8f;--ac2:#c99a62;--sel:#432a2e;--serif:Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",system-ui,sans-serif;display:flex;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
aside{width:250px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;z-index:4}
.brand{display:flex;gap:10px;align-items:center;font:700 21px var(--serif);padding:0 10px 22px}
.brand small{display:block;font:400 12px "Segoe UI",sans-serif;color:var(--mut)}
.nav{background:none;border:0;text-align:left;padding:11px 14px;border-radius:12px;color:var(--mut);cursor:pointer;font-size:15px}
.nav:hover{color:var(--text)}
.nav.on{background:var(--sel);color:var(--text);box-shadow:inset 3px 0 var(--ac)}
.stat{margin-top:auto;padding:10px 14px;color:var(--mut);font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac2);margin-right:8px}
main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;z-index:1}
header{display:flex;align-items:center;gap:14px;padding:18px 32px;border-bottom:1px solid var(--line)}
header h1{margin:0;font:700 24px var(--serif)}
header p{margin:0;color:var(--mut);font-size:13px}
.search{flex:1;max-width:520px;margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 18px;outline:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 16px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#2a1216;font-weight:600}
.btn.sm{padding:5px 11px;font-size:13px}
section{padding:28px 32px;flex:1}
.hero{border:1px solid var(--line);border-radius:20px;min-height:280px;padding:40px;display:flex;align-items:flex-end;gap:28px;justify-content:space-between;background:linear-gradient(120deg,#42242b,#2b1b18 60%,#1d1210);margin-bottom:30px;overflow:hidden}
.hero h2{margin:0 0 10px;font:700 clamp(30px,4.6vw,54px)/1.08 var(--serif);max-width:15ch}
.hero p{margin:0 0 18px;color:var(--mut)}
.hero img{height:230px;aspect-ratio:2/3;object-fit:cover;border-radius:14px;transform:rotate(4deg);box-shadow:0 10px 30px #0008;align-self:center}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.rh{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px}
h3{margin:0;font:700 19px var(--serif)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px;margin-bottom:30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.card .open{display:block;width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.card:hover{border-color:var(--ac)}
.poster{aspect-ratio:2/3;background:#2e1c20;position:relative;display:grid;place-items:center;font:40px var(--serif);color:var(--ac)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.heart{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:#140c0ecc;color:var(--ac);font-size:18px;cursor:pointer}
.cb{padding:10px 12px}
.cb b{display:block;font-size:14px;line-height:1.3}
.cb small{color:var(--mut);font-size:12px}
.tag{display:inline-block;background:var(--sel);border-radius:6px;padding:1px 7px;margin:4px 4px 0 0;font-size:11px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 14px;cursor:pointer;color:var(--mut);font-size:13px}
.chip.on{background:var(--sel);color:var(--text);border-color:var(--ac)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:24px}
.panel h3{margin-bottom:14px}
.panel form{display:grid;gap:10px}
.panel input,.panel textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.note{color:var(--mut);font-size:13px;margin:0 0 10px}
.src{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.src:first-of-type{border-top:0}
.src div{flex:1;min-width:0}
.src small{display:block;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.err{color:#f0a08f!important;white-space:normal!important}
.empty{color:var(--mut);padding:40px 0;text-align:center}
.nums{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:26px}
.nums b{display:block;font:700 28px var(--serif)}
.nums span{color:var(--mut);font-size:13px}
footer{padding:20px 32px;border-top:1px solid var(--line);color:var(--mut);font-size:13px;text-align:center;letter-spacing:.04em}
dialog{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:24px;width:min(640px,92vw);max-height:86vh}
dialog::backdrop{background:#0009}
.mh{display:flex;gap:20px;margin-bottom:22px}
.mh img{width:120px;aspect-ratio:2/3;object-fit:cover;border-radius:10px}
.mh h2{margin:0 0 6px;font:700 24px var(--serif)}
.fl{list-style:none;margin:14px 0 0;padding:0}
.fl li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.fl div{flex:1;min-width:0}
.fl small{display:block;color:var(--mut)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--sel);border:1px solid var(--ac);padding:10px 18px;border-radius:10px;display:none;z-index:9}
.petal{position:fixed;top:-8vh;z-index:3;pointer-events:none;border-radius:100% 0 100% 0;opacity:.5;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(55px,55vh) rotate(200deg)}100%{transform:translate(-35px,115vh) rotate(380deg)}}
@media(prefers-reduced-motion:reduce){.petal{display:none}}
@media(max-width:800px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:12px}.brand{width:100%;padding:0 6px 6px}.stat{display:none}header{flex-wrap:wrap;padding:14px 16px}section{padding:20px 16px}.hero{padding:24px}.hero img{display:none}}
</style>
</head>
<body>
<aside>
  <div class="brand"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C5 6 3 13 8 21c5-2 9-9 4-19z" fill="#d98c8f"/><path d="M12 2c3 6 1 13-4 19" fill="none" stroke="#7a4a43" stroke-width="1"/></svg><div>Ani-Me Log<small>Source viewer · beta</small></div></div>
  <button class="nav" data-v="home">Home</button>
  <button class="nav" data-v="library">Library</button>
  <button class="nav" data-v="latest">Latest</button>
  <button class="nav" data-v="watchlist">Watchlist</button>
  <button class="nav" data-v="history">History</button>
  <button class="nav" data-v="sources">Sources</button>
  <div class="stat"><span class="dot"></span><span id="side"></span></div>
</aside>
<main>
  <header>
    <div><h1 id="ttl">Home</h1><p id="sub"></p></div>
    <input class="search" id="q" type="search" placeholder="Search titles…" aria-label="Search titles">
    <button class="btn" data-act="refresh">Refresh all</button>
  </header>
  <section id="view"></section>
  <footer>thewiltedpetals.blooms</footer>
</main>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<script>
const K='animelog.v1',$=s=>document.querySelector(s),DLG=$('#dlg');
let st={sources:[],proxy:'',watch:{},hist:[]},view='home',q='',fsrc='',LIB={map:new Map(),list:[]};
try{Object.assign(st,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(st))}catch(e){toast('Browser storage is full, so this session won’t be cached.')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https?:\/\//i.test(u||'')?esc(u):'';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)}

/* hidden duplicate scanner: one normalised key per title */
const norm=t=>String(t).normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
  .replace(/[(\[][^)\]]*(dub|sub|raw|uncensored)[^)\]]*[)\]]/g,' ')
  .replace(/\b(english dub|dubbed|subbed|uncensored)\b/g,' ')
  .replace(/[^a-z0-9]+/g,' ').trim();

/* parsing: any JSON shape, RSS/Atom, Blogger */
const get=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const first=(o,ps)=>{for(const p of ps){const v=get(o,p);if(v&&typeof v!=='object')return v}return ''};
const big=u=>(u||'').replace(/\/s\d+(-c)?\//,'/s400/');
function clean(t){
  t=String(t).trim();let ep='';
  const m=t.match(/\b(?:episode|eps?\.?)\s*(\d+)/i);
  if(m){ep=m[1];t=t.slice(0,m.index)}
  t=t.replace(/\s*\[[^\]]*\]/g,'').replace(/\s*[–-]\s*(english|indo)[^]*$/i,'').trim();
  return{title:t||String(t),ep};
}
function mapItem(o){
  if(typeof o==='string')return{title:o.trim(),raw:o.trim()};
  if(!o||typeof o!=='object')return null;
  const raw=first(o,['title','name','title.english','title.romaji','title_english','attributes.canonicalTitle']);
  if(!raw)return null;
  const c=clean(raw);
  return{title:c.title,raw:String(raw),
    image:first(o,['image','img','poster','cover','thumbnail','images.jpg.image_url','coverImage.large','attributes.posterImage.small']),
    link:first(o,['url','siteUrl','link','href'])||(o.attributes&&o.attributes.slug?'https://kitsu.io/anime/'+o.attributes.slug:''),ep:c.ep||first(o,['episode','ep','latest_episode']),
    date:Date.parse(first(o,['date','published','updated_at','aired.from','attributes.startDate','created_at']))||0};
}
function findList(d,dep=0){
  if(Array.isArray(d))return d;
  if(!d||typeof d!=='object'||dep>4)return[];
  for(const k of ['data','items','results','anime','entries','list','media','series'])if(Array.isArray(d[k]))return d[k];
  for(const v of Object.values(d)){const r=findList(v,dep+1);if(r.length)return r}
  return[];
}
function parseXML(txt){
  const x=new DOMParser().parseFromString(txt,'text/xml');
  if(x.querySelector('parsererror'))throw new Error('Not valid JSON or RSS/Atom');
  return[...x.querySelectorAll('item,entry')].map(n=>{
    const g=t=>n.querySelector(t)?.textContent?.trim()||'';
    const l=n.querySelector('link'),th=n.getElementsByTagName('media:thumbnail')[0]||n.querySelector('enclosure');
    const raw=g('title'),c=clean(raw);
    return{title:c.title,raw,ep:c.ep,link:l?(l.getAttribute('href')||l.textContent.trim()):'',image:big(th?.getAttribute('url')),date:Date.parse(g('pubDate')||g('published')||g('updated'))||0};
  }).filter(i=>i.title);
}
function parseText(txt){
  let d;try{d=JSON.parse(txt)}catch(e){return parseXML(txt)}
  return findList(d).map(mapItem).filter(Boolean);
}

/* loading: a bare site address finds its own feed */
async function grab(u,body){
  const r=await fetch(st.proxy?st.proxy+encodeURIComponent(u):u,body?{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(body)}:undefined);
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.text();
}
function jsonp(u){
  return new Promise((res,rej)=>{
    const cb='_alcb'+Date.now(),sc=document.createElement('script');
    const done=()=>{clearTimeout(t);delete window[cb];sc.remove()};
    const t=setTimeout(()=>{done();rej(new Error('The source took too long to respond.'))},15000);
    window[cb]=d=>{done();res(d)};
    sc.onerror=()=>{done();rej(new Error('The source blocked the request or isn’t a Blogger site.'))};
    sc.src=u+'&callback='+cb;document.head.appendChild(sc);
  });
}
async function fetchItems(s){
  const o=new URL(s.url),root=!s.body&&o.pathname==='/'&&!o.search;
  const tries=root?[o.origin+'/feeds/posts/default?alt=rss&max-results=100',o.origin+'/feed',o.origin+'/rss.xml',o.origin+'/feed.xml',s.url]:[s.url];
  let last;
  for(const u of tries){
    try{const txt=await grab(u,s.body);let it=[];try{it=parseText(txt)}catch(e){}if(it.length)return it}catch(e){last=e}
  }
  if(root){
    try{
      const d=await jsonp(o.origin+'/feeds/posts/default?alt=json-in-script&max-results=150');
      const it=(d.feed.entry||[]).map(e=>{
        const l=(e.link||[]).find(x=>x.rel==='alternate'),raw=e.title.$t,c=clean(raw);
        return{title:c.title,raw,ep:c.ep,link:l?l.href:'',image:big((e.media$thumbnail||{}).url),date:Date.parse((e.published||{}).$t)||0};
      }).filter(i=>i.title);
      if(it.length)return it;
    }catch(e){last=last||e}
  }
  throw last||new Error('No feed found at this address. Try the site’s RSS or JSON URL.');
}
async function load(s){
  s.status='loading';render();
  try{
    s.items=s.raw!=null?parseText(s.raw):await fetchItems(s);
    s.status='ok';s.error='';s.updated=Date.now();
    if(!s.items.length)s.error='Loaded, but no titles were found in this source.';
  }catch(e){
    s.status='error';
    s.error=e.message==='Failed to fetch'?'The source blocked the request (CORS) or you’re offline. Try a proxy under Sources.':e.message;
  }
  save();render();
}
const refreshAll=()=>Promise.all(st.sources.filter(s=>s.url).map(load));

/* merge every source into one list (duplicates fold together silently) */
function build(){
  const m=new Map();
  st.sources.forEach(s=>(s.items||[]).forEach((i,idx)=>{
    const k=norm(i.title);if(!k)return;
    let e=m.get(k);
    if(!e){e={k,title:i.title,image:i.image,ep:i.ep,date:i.date||0,ord:idx,from:[]};m.set(k,e)}
    else{e.image=e.image||i.image;if(+i.ep>(+e.ep||0))e.ep=i.ep;e.date=Math.max(e.date,i.date||0);e.ord=Math.min(e.ord,idx)}
    const raw=i.raw||i.title;
    if(!e.from.some(f=>f.src===s.name&&f.raw===raw&&f.link===i.link))e.from.push({src:s.name,raw,ep:i.ep,link:i.link});
  }));
  return{map:m,list:[...m.values()].sort((a,b)=>a.title.localeCompare(b.title))};
}
const snap=e=>({k:e.k,title:e.title,image:e.image,ep:e.ep,from:e.from.slice(0,12)});
const wl=k=>!!st.watch[k];
const entryFor=k=>LIB.map.get(k)||st.watch[k]||st.hist.find(h=>h.k===k);

/* rendering */
const card=e=>`<article class="card"><button class="open" data-open="${esc(e.k)}"><div class="poster">${esc((e.title||'?')[0])}${e.image?`<img src="${safe(e.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</div>
<div class="cb"><b>${esc(e.title)}</b>${e.ep?`<small>Episode ${esc(e.ep)}</small>`:''}<div>${[...new Set(e.from.map(f=>f.src))].map(n=>`<span class="tag">${esc(n)}</span>`).join('')}</div></div></button>
<button class="heart" data-act="wl" data-k="${esc(e.k)}" aria-label="Toggle watchlist" aria-pressed="${wl(e.k)}">${wl(e.k)?'♥':'♡'}</button></article>`;
const grid=(l,msg)=>l.length?`<div class="grid">${l.map(card).join('')}</div>`:`<p class="empty">${msg||'Nothing here yet.'}</p>`;
const rowHead=(t,v)=>`<div class="rh"><h3>${t}</h3><button class="btn sm" data-act="go" data-v="${v}">See all</button></div>`;
const chips=()=>`<div class="chips"><button class="chip ${fsrc?'':'on'}" data-act="fs" data-s="">All sources</button>${st.sources.map(s=>`<button class="chip ${fsrc===s.name?'on':''}" data-act="fs" data-s="${esc(s.name)}">${esc(s.name)}</button>`).join('')}</div>`;

const AL=(sort,x='')=>({query:`query{Page(perPage:50){media(type:ANIME,${x}sort:${sort}){title{romaji english}coverImage{large}siteUrl}}}`});
const PRESETS=[
{name:'AniList · Trending',url:'https://graphql.anilist.co',body:AL('TRENDING_DESC')},
{name:'AniList · Airing now',url:'https://graphql.anilist.co',body:AL('POPULARITY_DESC','status:RELEASING,')},
{name:'Jikan (MyAnimeList) · Top',url:'https://api.jikan.moe/v4/top/anime'},
{name:'Jikan (MyAnimeList) · Airing now',url:'https://api.jikan.moe/v4/seasons/now'},
{name:'Kitsu · Most popular',url:'https://kitsu.io/api/edge/anime?sort=-userCount&page[limit]=20'},
{name:'Kitsu · Airing now',url:'https://kitsu.io/api/edge/anime?filter[status]=current&sort=-userCount&page[limit]=20'}];
const SNIP=`(async()=>{const sleep=t=>new Promise(r=>setTimeout(r,t));let last=0,same=0;while(same<3){window.scrollTo(0,document.body.scrollHeight);document.querySelectorAll('button').forEach(b=>{if(/load more|show more|see more/i.test(b.textContent))b.click()});await sleep(1200);const n=document.querySelectorAll('a[href]').length;same=n===last?same+1:0;last=n}const roots=[document];(function w(n){n.querySelectorAll('*').forEach(e=>{if(e.shadowRoot){roots.push(e.shadowRoot);w(e.shadowRoot)}})})(document);const seen=new Set(),out=[];roots.forEach(r=>r.querySelectorAll('a[href]').forEach(a=>{const h=a.href;if(h===location.href||seen.has(h))return;if(!/\\/(series|programme|programmes|movie|movies|show|shows)\\//i.test(h))return;const im=a.querySelector('img');const t=(a.getAttribute('aria-label')||(im&&im.alt)||a.title||a.textContent||'').trim().replace(/\\s+/g,' ');if(!t||t.length>120)return;seen.add(h);out.push({title:t,url:h,image:im?(im.currentSrc||im.src):''})}));const j=JSON.stringify(out,null,1);try{await navigator.clipboard.writeText(j);console.log(out.length+' titles copied. Paste them into Ani-Me Log.')}catch(e){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));l.download='capture.json';l.click();console.log(out.length+' titles saved as capture.json. Use Import file in Ani-Me Log.')}})()`;

function srcView(){
  return`<div class="panel"><h3>Add a source</h3>
<form id="add"><input name="name" placeholder="Name (optional)" aria-label="Source name">
<input name="url" placeholder="Site, feed or JSON address, e.g. donghuazone.com" aria-label="Source address">
<textarea name="raw" rows="3" placeholder="…or paste JSON / RSS text here" aria-label="Pasted data"></textarea>
<div class="row"><button class="btn pri" type="submit">Add source</button>
<label class="btn">Import file<input id="file" type="file" accept=".json,.xml,.rss,.txt" hidden></label>
<button class="btn" type="button" data-act="preset" data-n="Donghua Zone" data-u="https://www.donghuazone.com/">Donghua Zone</button>
<button class="btn" type="button" data-act="preset" data-n="MeWatch Anime" data-u="">MeWatch Anime</button>
<button class="btn" type="button" data-act="export">Export sources</button></div></form></div>
<div class="panel"><h3>Quick add</h3><p class="note">Open anime databases and trackers. Tap to add.</p><div class="row">${PRESETS.map((p,i)=>`<button class="btn" data-act="quick" data-i="${i}">${esc(p.name)}</button>`).join('')}</div></div>
<div class="panel"><h3>Your sources (${st.sources.length})</h3>
${st.sources.map(s=>`<div class="src"><div><b>${esc(s.name)}</b><small>${esc(s.url||'Pasted or imported data')}</small>
<small class="${s.status==='error'||s.error?'err':''}">${s.status==='loading'?'Loading…':s.error||`${(s.items||[]).length} items`}</small></div>
${s.url?`<button class="btn sm" data-act="reload" data-id="${s.id}">Reload</button>`:''}
<button class="btn sm" data-act="del" data-id="${s.id}">Remove</button></div>`).join('')||'<p class="empty">No sources yet.</p>'}</div>
<div class="panel"><h3>Capture a site that blocks apps (MeWatch and similar)</h3>
<p class="note">Some sites draw their lists with scripts, so no app can read them directly. Capture the list from your own browser instead: 1) open the page (for MeWatch, mewatch.sg/series/anime) and scroll down until everything has loaded; 2) press F12, open Console, paste the snippet and press Enter (it scrolls the page for you, so wait until it reports a count) (if asked, type “allow pasting” first); 3) pick “MeWatch Anime” above, paste into the data box and add (if it downloaded a file instead, use Import file). I couldn’t open that page myself, so check the result and tell me if titles are missing. Re-run the capture whenever you want an update.</p>
<textarea rows="4" readonly aria-label="Capture snippet">${esc(SNIP)}</textarea>
<div class="row" style="margin-top:10px"><button class="btn" data-act="copysnip">Copy snippet</button></div></div>
<div class="panel"><h3>CORS proxy (optional)</h3><p class="note">If a site blocks direct requests, enter a proxy prefix that takes the encoded address on the end.</p>
<input id="proxy" value="${esc(st.proxy)}" placeholder="https://your-proxy.example/?url=" aria-label="Proxy prefix"></div>`;
}

function render(){
  LIB=build();const L=LIB.list;
  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const needle=norm(q);
  const flt=a=>{let r=a;if(fsrc)r=r.filter(e=>e.from.some(f=>f.src===fsrc));if(needle)r=r.filter(e=>norm(e.title).includes(needle));return r};
  const latest=[...L].sort((a,b)=>(b.date-a.date)||(a.ord-b.ord));
  const W=Object.values(st.watch).reverse().map(x=>LIB.map.get(x.k)||x),H=st.hist.map(x=>LIB.map.get(x.k)||x);
  $('#side').textContent=`${st.sources.length} sources · ${L.length} titles`;
  let h='',T;
  if(view==='home'){
    T=['Home','What your sources have, in one place'];
    const hero=latest.find(e=>e.image)||latest[0];
    if(needle)h=`<h3 style="margin-bottom:14px">Results</h3>${grid(flt(L),'No titles match your search.')}`;
    else{
      h=hero?`<div class="hero"><div><h2>${esc(hero.title)}</h2><p>${hero.ep?`Episode ${esc(hero.ep)} · `:''}In ${new Set(hero.from.map(f=>f.src)).size} source(s)</p>
<div class="row"><button class="btn pri" data-open="${esc(hero.k)}">View details</button><button class="btn" data-act="wl" data-k="${esc(hero.k)}">${wl(hero.k)?'In watchlist':'+ Watchlist'}</button></div></div>${hero.image?`<img src="${safe(hero.image)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</div>`
      :`<div class="hero"><div><h2>Add your first source</h2><p>Add a site or feed and Ani-Me Log lists what it has.</p><button class="btn pri" data-act="go" data-v="sources">Add source</button></div></div>`;
      h+=`<div class="nums"><div><b>${st.sources.length}</b><span>Sources</span></div><div><b>${L.length}</b><span>Titles</span></div><div><b>${W.length}</b><span>Watchlist</span></div></div>`;
      h+=rowHead('Latest','latest')+grid(latest.slice(0,12));
      if(W.length)h+=rowHead('Watchlist','watchlist')+grid(W.slice(0,6));
      if(H.length)h+=rowHead('History','history')+grid(H.slice(0,6));
    }
  }else if(view==='library'){const f=flt(L);T=['Library',`${f.length} titles`];h=chips()+grid(f,'No titles yet. Add a source under Sources.')}
  else if(view==='latest'){const f=flt(latest).slice(0,80);T=['Latest','Newest first'];h=chips()+grid(f,'No titles yet. Add a source under Sources.')}
  else if(view==='watchlist'){const f=flt(W);T=['Watchlist',`${W.length} saved`];h=grid(f,'Tap the heart on any title to save it here.')}
  else if(view==='history'){const f=flt(H);T=['History','Recently opened'];h=(H.length?`<div class="row" style="margin-bottom:16px"><button class="btn sm" data-act="clrh">Clear history</button></div>`:'')+grid(f,'Titles you open will appear here.')}
  else{T=['Sources','Add as many as you like'];h=srcView()}
  $('#ttl').textContent=T[0];$('#sub').textContent=T[1];
  if(document.activeElement?.id!=='proxy')$('#view').innerHTML=h;
}

function modal(e){
  const from=[...e.from].sort((a,b)=>(+b.ep||0)-(+a.ep||0));
  DLG.innerHTML=`<div class="mh">${e.image?`<img src="${safe(e.image)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:''}<div><h2>${esc(e.title)}</h2>${e.ep?`<p class="note">Latest: episode ${esc(e.ep)}</p>`:''}
<div class="row"><button class="btn pri" data-act="wl" data-k="${esc(e.k)}">${wl(e.k)?'Remove from watchlist':'+ Watchlist'}</button><button class="btn" data-act="close">Close</button></div></div></div>
<h3>On ${new Set(from.map(f=>f.src)).size} source(s)</h3>
<ul class="fl">${from.map(f=>`<li><div><b>${esc(f.src)}</b><small>${esc(f.raw)}</small></div>${safe(f.link)?`<a class="btn sm" href="${safe(f.link)}" target="_blank" rel="noopener noreferrer">Open</a>`:''}</li>`).join('')}</ul>`;
  if(!DLG.open)DLG.showModal();
}

/* events */
document.addEventListener('click',async ev=>{
  if(ev.target===DLG){DLG.close();return}
  const n=ev.target.closest('.nav');if(n){view=n.dataset.v;render();return}
  const o=ev.target.closest('[data-open]');
  if(o&&!ev.target.closest('.heart')){
    const e=entryFor(o.dataset.open);
    if(e){st.hist=[snap(e),...st.hist.filter(h=>h.k!==e.k)].slice(0,100);save();modal(e)}
    return;
  }
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,s=st.sources.find(x=>x.id===b.dataset.id);
  if(a==='close')DLG.close();
  if(a==='go'){view=b.dataset.v;render()}
  if(a==='fs'){fsrc=b.dataset.s;render()}
  if(a==='wl'){const k=b.dataset.k,e=entryFor(k);if(wl(k))delete st.watch[k];else if(e)st.watch[k]=snap(e);save();if(DLG.open&&e)modal(e);render()}
  if(a==='clrh'){st.hist=[];save();render()}
  if(a==='refresh'){if(!st.sources.length)return toast('Add a source first.');await refreshAll();toast('Sources refreshed.')}
  if(a==='reload'&&s)load(s);
  if(a==='del'&&s){st.sources=st.sources.filter(x=>x!==s);if(fsrc===s.name)fsrc='';save();render()}
  if(a==='preset'){const f=$('#add');f.name.value=b.dataset.n;f.url.value=b.dataset.u;if(!b.dataset.u){f.raw.focus();toast('Paste your captured list into the data box.')}}
  if(a==='quick'){const p=PRESETS[+b.dataset.i];if(st.sources.some(x=>x.name===p.name))return toast('Already added.');
    const ns={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:p.name,url:p.url,items:[]};if(p.body)ns.body=p.body;st.sources.push(ns);load(ns)}
  if(a==='copysnip'){try{await navigator.clipboard.writeText(SNIP);toast('Snippet copied.')}catch(e){toast('Select the snippet and copy it by hand.')}}
  if(a==='export'){const blob=new Blob([JSON.stringify(st.sources.filter(s=>s.url).map(({name,url,body})=>body?{name,url,body}:{name,url}),null,2)],{type:'application/json'});
    const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download='sources.json';l.click()}
});
document.addEventListener('submit',async ev=>{
  if(ev.target.id!=='add')return;ev.preventDefault();
  const f=ev.target,raw=f.raw.value.trim();let url=f.url.value.trim();
  if(url&&!/^[a-z]+:\/\//i.test(url))url='https://'+url;
  if(!url&&!raw)return toast('Enter an address or paste some data.');
  if(url&&st.sources.some(s=>s.url===url))return toast('That source is already added.');
  let name=f.name.value.trim();
  if(!name){try{name=url?new URL(url).hostname:'Pasted source'}catch(e){return toast('That address doesn’t look right.')}}
  let s=raw&&!url?st.sources.find(x=>x.raw!=null&&x.name===name):null;
  if(s)s.raw=raw;else{s={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name,url,items:[]};if(raw)s.raw=raw;st.sources.push(s)}
  f.reset();await load(s);
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='file'){const fl=ev.target.files[0];if(!fl)return;const r=new FileReader();
    r.onload=()=>{const s={id:Date.now().toString(36),name:fl.name,url:'',raw:r.result,items:[]};st.sources.push(s);load(s)};r.readAsText(fl)}
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='q'){q=ev.target.value;render()}
  if(ev.target.id==='proxy'){st.proxy=ev.target.value.trim();save()}
});
DLG.addEventListener('close',render);

/* drifting petals */
(()=>{const c=['#d98c8f','#b9686f','#c99a62','#8a5a4a','#e3b0a6'];
  for(let i=0;i<16;i++){const p=document.createElement('i'),w=10+Math.random()*14;p.className='petal';
    Object.assign(p.style,{left:Math.random()*100+'vw',width:w+'px',height:w*1.3+'px',background:`linear-gradient(135deg,${c[i%5]},#5a3a32)`,animationDuration:(16+Math.random()*16)+'s',animationDelay:(-Math.random()*30)+'s'});
    document.body.appendChild(p)}})();

/* start: also pull sources.json from the repo, if present */
(async()=>{
  try{
    const r=await fetch('sources.json',{cache:'no-store'});
    if(r.ok){const list=await r.json();
      (Array.isArray(list)?list:[]).forEach(x=>{
        if(x&&/^https?:\/\//i.test(x.url||'')&&!st.sources.some(s=>s.url===x.url))
          st.sources.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:x.name||new URL(x.url).hostname,url:x.url,body:x.body,items:[]});
      });save();
    }
  }catch(e){}
  render();
  st.sources.filter(s=>s.url&&!(s.items||[]).length).forEach(load);
})();
</script>
</body>
</html>
